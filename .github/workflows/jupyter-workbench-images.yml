name: jupyter-workbench-images

on:
  pull_request:
    branches: [dev]
    paths:
      - containers/jupyterhub-workbench/**
      - containers/jupyter-workbench/**
      - .github/workflows/jupyter-workbench-images.yml
  push:
    branches: [dev, main]
    paths:
      - containers/jupyterhub-workbench/**
      - containers/jupyter-workbench/**
      - .github/workflows/jupyter-workbench-images.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: containers/jupyterhub-workbench
            image: infra-hpc-qc-k8s-jupyterhub-workbench
          - context: containers/jupyter-workbench
            image: infra-hpc-qc-k8s-jupyter-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/nyameko/${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/nyameko/${{ matrix.image }}:${{ github.event_name == 'push' && github.ref_name || 'pr-check' }}
