name: Publish GitHub Wiki
on:
  push:
    branches: [dev]
    paths:
      - 'docs/wiki/**'
      - 'scripts/publish-github-wiki.sh'
      - 'scripts/prepare_github_wiki.py'
      - 'scripts/test_prepare_github_wiki.py'
      - 'scripts/check-wiki-docs.py'
      - '.github/workflows/publish-github-wiki.yml'
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths: ['docs/wiki/**', 'docs/WIKI_PUBLISHING.md', 'scripts/publish-github-wiki.sh', 'scripts/prepare_github_wiki.py', 'scripts/test_prepare_github_wiki.py', 'scripts/check-wiki-docs.py', '.github/workflows/publish-github-wiki.yml']
permissions:
  contents: read
concurrency:
  group: wiki-${{ github.repository }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public Wiki sources and index
        run: python3 scripts/check-wiki-docs.py
      - name: Test rendered Wiki link conversion
        run: python3 -m unittest discover -s scripts -p 'test_prepare_github_wiki.py' -v
      - name: Generate offline rendered Wiki preview
        run: >-
          python3 scripts/prepare_github_wiki.py --source docs/wiki
          --destination "$RUNNER_TEMP/wiki-preview" --repo "$GITHUB_REPOSITORY"
  publish:
    needs: validate
    permissions:
      contents: write
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source documentation
        run: python3 scripts/check-wiki-docs.py
      - name: Configure GitHub App Git credential helper
        run: |
          gh auth setup-git
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify Wiki initialization
        run: git ls-remote "https://github.com/${GITHUB_REPOSITORY}.wiki.git" HEAD
      - name: Preview publication
        run: bash scripts/publish-github-wiki.sh --dry-run
      - name: Publish reviewed pages
        run: bash scripts/publish-github-wiki.sh
