name: Ansible CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "ansible/**"
      - "tests/ansible/**"
      - ".github/workflows/ansible.yml"
  push:
    branches: [dev, main]
    paths:
      - "ansible/**"
      - "tests/ansible/**"
      - ".github/workflows/ansible.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ansible-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: python3 -m pip install --user ansible-core ansible-lint

      - name: Install required Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Syntax check
        working-directory: ansible
        run: |
          for playbook in playbooks/*.yml; do
            ansible-playbook "$playbook" --syntax-check
          done

      # Full repository audit has inherited failures; keep it visible for M6.
      - name: Existing Ansible lint audit (known baseline debt)
        working-directory: ansible
        run: ansible-lint .
        continue-on-error: true

      # New M4g role is fully gated; older roles keep syntax coverage above.
      - name: Strict lint on new M4g terminal role and playbook
        working-directory: ansible
        run: ansible-lint roles/research_terminal_clients playbooks/research-terminals.yml

  ansible-integration:
    if: ${{ vars.ANSIBLE_INTEGRATION_ENABLED == 'true' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Convergence test
        run: bash tests/ansible/convergence.sh
      - name: Functional test
        run: bash tests/ansible/functional.sh
