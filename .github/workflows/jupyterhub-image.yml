name: jupyterhub-images

on:
  pull_request:
    branches: [dev]
    paths:
      - containers/jupyterhub/**
      - containers/jupyter-singleuser/**
      - .github/workflows/jupyterhub-image.yml
  push:
    branches: [dev, main]
    paths:
      - containers/jupyterhub/**
      - containers/jupyter-singleuser/**
      - .github/workflows/jupyterhub-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: hub
            context: containers/jupyterhub
            image: infra-hpc-qc-k8s-jupyterhub
          - component: singleuser
            context: containers/jupyter-singleuser
            image: infra-hpc-qc-k8s-jupyter-singleuser
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/nyameko/${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/nyameko/${{ matrix.image }}:sha-${{ github.sha }}
