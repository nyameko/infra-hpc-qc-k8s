name: jupyterhub-image

on:
  pull_request:
    branches: [dev]
    paths:
      - containers/jupyterhub/**
      - .github/workflows/jupyterhub-image.yml
  push:
    branches: [dev, main]
    paths:
      - containers/jupyterhub/**
      - .github/workflows/jupyterhub-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: containers/jupyterhub
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/nyameko/infra-hpc-qc-k8s-jupyterhub:${{ github.ref_name }}
            ghcr.io/nyameko/infra-hpc-qc-k8s-jupyterhub:sha-${{ github.sha }}
