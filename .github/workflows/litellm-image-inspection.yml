name: LiteLLM immutable image inspection
on:
  pull_request:
    branches: [dev, main]
    paths:
      - .github/workflows/litellm-image-inspection.yml
      - argocd/resources/litellm/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enable Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Read GHCR image digest (no pull or execution)
        env:
          LITELLM_IMAGE: ghcr.io/berriai/litellm:v1.90.2
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/litellm-inspection.txt"
          docker buildx imagetools inspect "$LITELLM_IMAGE" | tee "$output"

          digest="$(awk '$1 == "Digest:" {print $2; exit}' "$output")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not verify a valid immutable image digest"
            exit 1
          fi

          # For a multi-architecture index, require an amd64 image for Sebowa.
          if grep -Eq '^(MediaType:[[:space:]]+)(application/vnd.oci.image.index.v1\\+json|application/vnd.docker.distribution.manifest.list.v2\\+json)' "$output"; then
            if ! grep -Eq '^[[:space:]]+Platform:[[:space:]]+linux/amd64([[:space:]]|$)' "$output"; then
              echo "::error::Image index lacks linux/amd64"
              exit 1
            fi
          fi

          echo "Verified registry manifest reference: ghcr.io/berriai/litellm@$digest"
          echo "Pin the SAME verified digest in deployment.yaml and migrate-job.yaml."
          echo "Registry metadata inspection is NOT supply-chain provenance verification."
