name: Inspect ACP personal-worker candidate image (no deployment)
on:
  # Intentionally manual. The older workflow pushed a new image directly to
  # GitOps main every five minutes, triggering worker auto-reconciliation.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acp-personal-worker-image-inspection
  cancel-in-progress: false

jobs:
  inspect-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Discover current ACP dev commit
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://github.com/nyameko/agent-control-plane.git refs/heads/dev | awk '{print $1}')"
          if [[ ! "$sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Could not resolve ACP dev SHA"
            exit 1
          fi
          echo "ACP_DEV_SHA=$sha" >> "$GITHUB_ENV"
          echo "Candidate source revision: $sha"
      - name: Inspect published immutable API and Hermes image digests
        shell: bash
        run: |
          set -euo pipefail
          for name in agent-control-plane agent-control-plane-hermes; do
            tag="ghcr.io/nyameko/${name}:sha-${ACP_DEV_SHA}"
            if ! output="$(docker buildx imagetools inspect "$tag" 2>&1)"; then
              echo "::error::Cannot inspect published candidate $tag"
              echo "$output"
              exit 1
            fi
            digest="$(printf '%s\\n' "$output" | awk '$1 == "Digest:" { print $2; exit }')"
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Invalid digest for $tag"
              exit 1
            fi
            echo "Verified candidate: ghcr.io/nyameko/${name}@${digest}"
          done
          echo "Inspection only: open reviewed feature-branch PR to change GitOps."
          echo "Never write directly to main or trigger a rollout from this workflow."
