name: Terraform CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "terraform/**"
      - "tests/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [dev, main]
    paths:
      - "terraform/**"
      - "tests/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init and validate public environments
        run: |
          set -euo pipefail
          for environment in template ace; do
            terraform -chdir="terraform/environments/$environment" init -backend=false
            terraform -chdir="terraform/environments/$environment" validate
          done

      - name: Terraform plan
        if: ${{ vars.TERRAFORM_CI_PLAN_ENABLED == 'true' }}
        working-directory: terraform/environments/template
        run: terraform plan -refresh=false -input=false -lock=false -out=tfplan

      - name: Policy and security checks
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: true

      - name: Upload Terraform plan
        if: ${{ vars.TERRAFORM_CI_PLAN_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/environments/template/tfplan
