apiVersion: v1
kind: Pod
metadata:
  name: jupyter-nfs-smoke
  namespace: jupyterhub
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 20999
    runAsGroup: 20999
    fsGroup: 20999
  containers:
    - name: smoke
      image: busybox:1.37.0
      command:
        - /bin/sh
        - -lc
        - |
          set -eu
          id
          test -d /home/research/jhub-smoke
          printf 'phase-b kubernetes write: %s\n' "$(date -u +%FT%TZ)"             > /home/research/jhub-smoke/phase-b-from-kubernetes.txt
          cat /home/research/jhub-smoke/phase-b-from-kubernetes.txt
          sleep 3600
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: research-home
          mountPath: /home/research
  volumes:
    - name: research-home
      nfs:
        server: storage.internal
        path: /srv/home
        readOnly: false
