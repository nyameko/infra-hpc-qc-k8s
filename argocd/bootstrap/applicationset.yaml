apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-applications
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/nyameko/infra-hpc-qc-k8s.git
        revision: main
        directories:
          - path: argocd/applications/*

  template:
    metadata:
      name: '{{path.basename}}'
      namespace: argocd

    spec:
      project: default

      source:
        repoURL: https://github.com/nyameko/infra-hpc-qc-k8s.git
        targetRevision: main
        path: '{{path}}'

      destination:
        server: https://kubernetes.default.svc
        namespace: argocd

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
