apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd

spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  source:
    repoURL: registry-1.docker.io/jetstack/charts
    chart: cert-manager
    targetRevision: v1.21.1

    helm:
      releaseName: cert-manager

      values: |
        crds:
          enabled: true

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
