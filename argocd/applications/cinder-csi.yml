apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cinder-csi
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  sources:

    # Vendor application
    - repoURL: https://kubernetes.github.io/cloud-provider-openstack
      chart: openstack-cinder-csi
      targetRevision: 2.36.0

      helm:
        releaseName: cinder-csi

        valuesObject:
          clusterID: kubernetes

          secret:
            enabled: true
            create: false
            name: cinder-csi-cloud-config
            filename: cloud.conf

          storageClass:
            enabled: false

          csi:
            provisioner:
              topology: true
            snapshotter:
              enabled: true

          plugin:
            httpEndpoint:
              enabled: false
            controllerPlugin:
              replicas: 3

    # Our Kubernetes resources
    - repoURL: https://github.com/nyameko/infra-hpc-qc-k8s.git
      targetRevision: main
      path: argocd/resources/cinder-csi

    # Our encrypted credentials
    - repoURL: https://github.com/nyameko/infra-hpc-qc-k8s.git
      targetRevision: main
      path: secrets/cinder

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
