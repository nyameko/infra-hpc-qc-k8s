apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nyameko/infra-hpc-qc-k8s.git
    targetRevision: main
    path: argocd/resources/litellm
  destination:
    server: https://kubernetes.default.svc
    namespace: litellm
  # Manual first sync after secret provision and fabric egress review.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
