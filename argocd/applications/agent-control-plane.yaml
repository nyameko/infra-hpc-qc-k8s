apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-control-plane
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nyameko/infra-hpc-qc-k8s.git
    targetRevision: main
    path: argocd/resources/agent-control-plane
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-control-plane
  # The reviewed infra main commit is the production deployment approval.
  # A schema-version gate in acp-migrate blocks unapproved database upgrades.
  # Never prune this app: preserve PostgreSQL, PVCs, secrets and run history.
  # No deletion finalizer: Application deletion must not cascade to durable state.
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
