apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Deployment
      name: quantum-platform-user-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: quantum-platform-user-api
      spec:
        template:
          spec:
            containers:
              - name: user-api
                env:
                  - name: AGENT_CONTROL_PLANE_URL
                    value: http://agent-control-plane-api.agent-control-plane.svc.cluster.local:8080
                  - name: AGENT_CONTROL_PLANE_SIGNING_KEY_FILE
                    value: /var/run/acp/private.pem
                  - name: AGENT_CONTROL_PLANE_TENANT
                    value: nyameko
                volumeMounts:
                  - name: acp-signing
                    mountPath: /var/run/acp
                    readOnly: true
            volumes:
              - name: acp-signing
                secret:
                  secretName: acp-signing
