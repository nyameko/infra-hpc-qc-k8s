apiVersion: v1
kind: Namespace
metadata:
  name: jupyterhub
  annotations:
    # This namespace is shared with research pods; never remove it by app prune/deletion.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app.kubernetes.io/name: jupyterhub
    app.kubernetes.io/part-of: quantum-platform
