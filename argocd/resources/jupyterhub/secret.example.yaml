# Shape reference only. Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: jupyterhub-bootstrap
  namespace: jupyterhub
type: Opaque
stringData:
  smoke-password: CHANGE-ME
---
apiVersion: v1
kind: Secret
metadata:
  name: jupyterhub-slurm-ssh
  namespace: jupyterhub
type: Opaque
stringData:
  id_ed25519: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    REPLACE-ME
    -----END OPENSSH PRIVATE KEY-----
  known_hosts: |
    slurm-gateway.internal ssh-ed25519 REPLACE-ME
