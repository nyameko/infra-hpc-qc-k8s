apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyterhub
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jupyterhub
  template:
    metadata:
      labels:
        app: jupyterhub
    spec:
      serviceAccountName: jupyterhub-hub
      containers:
        - name: hub
          image: jupyterhub-control
          args: ["jupyterhub", "-f", "/etc/jupyterhub/jupyterhub_config.py"]
          ports:
            - {name: proxy, containerPort: 8000}
            - {name: hub, containerPort: 8081}
          env:
            - name: JUPYTERHUB_BOOTSTRAP_USER
              valueFrom:
                secretKeyRef:
                  name: jupyterhub-bootstrap
                  key: username
            - name: JUPYTERHUB_BOOTSTRAP_UID
              valueFrom:
                secretKeyRef:
                  name: jupyterhub-bootstrap
                  key: uid
            - name: JUPYTERHUB_BOOTSTRAP_GID
              valueFrom:
                secretKeyRef:
                  name: jupyterhub-bootstrap
                  key: gid
            - name: JUPYTERHUB_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jupyterhub-bootstrap
                  key: password
            - name: JUPYTER_NODE_SELECTOR
              valueFrom:
                configMapKeyRef:
                  name: jupyterhub-config
                  key: JUPYTER_NODE_SELECTOR
            - name: RESEARCH_HOME_NFS_SERVER
              valueFrom:
                configMapKeyRef:
                  name: jupyterhub-config
                  key: RESEARCH_HOME_NFS_SERVER
            - name: RESEARCH_HOME_NFS_PATH
              valueFrom:
                configMapKeyRef:
                  name: jupyterhub-config
                  key: RESEARCH_HOME_NFS_PATH
          volumeMounts:
            - name: config
              mountPath: /etc/jupyterhub/jupyterhub_config.py
              subPath: jupyterhub_config.py
              readOnly: true
            - name: data
              mountPath: /srv/jupyterhub
          readinessProbe:
            httpGet:
              path: /hub/health
              port: hub
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          configMap:
            name: jupyterhub-config
        - name: data
          persistentVolumeClaim:
            claimName: jupyterhub-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyterhub-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cinder-ssd
  resources:
    requests:
      storage: 5Gi
