apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyterhub-workbench
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jupyterhub-workbench
  template:
    metadata:
      labels:
        app: jupyterhub-workbench
    spec:
      serviceAccountName: jupyterhub-workbench-hub
      containers:
        - name: hub
          image: jupyterhub-control
          args: ["jupyterhub", "-f", "/etc/jupyterhub/jupyterhub_config.py"]
          ports:
            - {name: proxy, containerPort: 8000}
            - {name: hub, containerPort: 8081}
          env:
            - name: JUPYTERHUB_PLATFORM_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: jupyterhub-workbench-platform
                  key: launch_signing_key
            - name: JUPYTERHUB_PLATFORM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jupyterhub-workbench-platform
                  key: api_token
            - name: JUPYTERHUB_CRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: jupyterhub-workbench-platform
                  key: crypt_key
            - name: QUANTUM_PLATFORM_WORKBENCH_URL
              valueFrom:
                configMapKeyRef:
                  name: jupyterhub-workbench-config
                  key: QUANTUM_PLATFORM_WORKBENCH_URL
            - name: JUPYTER_NODE_SELECTOR
              valueFrom:
                configMapKeyRef:
                  name: jupyterhub-workbench-config
                  key: JUPYTER_NODE_SELECTOR
            - name: RESEARCH_HOME_NFS_SERVER
              valueFrom:
                configMapKeyRef:
                  name: jupyterhub-workbench-config
                  key: RESEARCH_HOME_NFS_SERVER
            - name: RESEARCH_HOME_NFS_PATH
              valueFrom:
                configMapKeyRef:
                  name: jupyterhub-workbench-config
                  key: RESEARCH_HOME_NFS_PATH
          volumeMounts:
            - name: config
              mountPath: /etc/jupyterhub/jupyterhub_config.py
              subPath: jupyterhub_config.py
              readOnly: true
            - name: data
              mountPath: /srv/jupyterhub
          readinessProbe:
            httpGet:
              path: /hub/health
              port: hub
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: config
          configMap:
            name: jupyterhub-workbench-config
        - name: data
          persistentVolumeClaim:
            claimName: jupyterhub-workbench-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyterhub-workbench-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cinder-ssd
  resources:
    requests:
      storage: 5Gi
