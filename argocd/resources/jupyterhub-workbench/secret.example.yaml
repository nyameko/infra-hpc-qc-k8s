# Shape reference only. Do not commit real values.
#
# The same launch_signing_key and api_token values must be sealed into the
# quantum-platform namespace as JUPYTERHUB_LAUNCH_SIGNING_KEY and
# JUPYTERHUB_API_TOKEN respectively.
apiVersion: v1
kind: Secret
metadata:
  name: jupyterhub-workbench-platform
  namespace: jupyterhub
type: Opaque
stringData:
  launch_signing_key: CHANGE-ME
  api_token: CHANGE-ME
  # JupyterHub auth_state encryption key; generate 32 random bytes as hex.
  crypt_key: CHANGE-ME
