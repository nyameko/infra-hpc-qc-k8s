apiVersion: v1
kind: ConfigMap
metadata:
  name: jupyterhub-workbench-config
data:
  JUPYTER_NODE_SELECTOR: ""
  RESEARCH_HOME_NFS_SERVER: storage.internal
  RESEARCH_HOME_NFS_PATH: /srv/home
  QUANTUM_PLATFORM_WORKBENCH_URL: https://quantum.nyameko.com/workbench/
  jupyterhub_config.py: |
    import os

    from kubespawner import KubeSpawner
    from platform_auth import PlatformLaunchAuthenticator

    c = get_config()

    nfs_server = os.environ["RESEARCH_HOME_NFS_SERVER"]
    nfs_path = os.environ["RESEARCH_HOME_NFS_PATH"]
    platform_api_token = os.environ["JUPYTERHUB_PLATFORM_API_TOKEN"]

    # Quantum Platform is authoritative for browser identity. A short-lived
    # signed launch assertion carries the already-provisioned POSIX UID/GID.
    c.JupyterHub.authenticator_class = PlatformLaunchAuthenticator
    c.Authenticator.allow_all = True
    c.Authenticator.enable_auth_state = True
    c.Authenticator.auto_login = True

    c.JupyterHub.spawner_class = KubeSpawner
    c.JupyterHub.bind_url = "http://0.0.0.0:8000"
    c.JupyterHub.hub_bind_url = "http://0.0.0.0:8081"
    c.JupyterHub.hub_connect_url = "http://jupyterhub-workbench.jupyterhub.svc.cluster.local:8081"
    c.JupyterHub.db_url = "sqlite:////srv/jupyterhub/jupyterhub.sqlite"
    c.JupyterHub.cookie_secret_file = "/srv/jupyterhub/jupyterhub_cookie_secret"

    c.KubeSpawner.namespace = "jupyterhub"
    c.KubeSpawner.image = "ghcr.io/nyameko/infra-hpc-qc-k8s-jupyter-workbench:dev"
    c.KubeSpawner.image_pull_policy = "IfNotPresent"
    c.KubeSpawner.cmd = ["/usr/local/bin/start-workbench"]
    c.KubeSpawner.start_timeout = 300

    # Cheap workbench on today's shared workers. Heavy execution bursts elsewhere.
    c.KubeSpawner.cpu_guarantee = 0.1
    c.KubeSpawner.cpu_limit = 2
    c.KubeSpawner.mem_guarantee = "1G"
    c.KubeSpawner.mem_limit = "4G"

    node_selector = os.environ.get("JUPYTER_NODE_SELECTOR", "").strip()
    if node_selector:
        key, value = node_selector.split("=", 1)
        c.KubeSpawner.node_selector = {key.strip(): value.strip()}

    c.KubeSpawner.volumes = [
        {
            "name": "research-home",
            "nfs": {
                "server": nfs_server,
                "path": nfs_path,
                "readOnly": False,
            },
        }
    ]
    c.KubeSpawner.volume_mounts = [
        {
            "name": "research-home",
            "mountPath": "/home/research",
            "readOnly": False,
        }
    ]

    c.KubeSpawner.automount_service_account_token = False

    async def apply_platform_identity(spawner):
        auth_state = await spawner.user.get_auth_state()
        if not auth_state:
            raise RuntimeError("Quantum Platform auth_state is missing.")

        uid = int(auth_state["uid"])
        gid = int(auth_state["gid"])

        spawner.uid = uid
        spawner.gid = gid
        spawner.fs_gid = gid
        spawner.working_dir = f"/home/research/{spawner.user.name}"
        spawner.environment = {
            **dict(spawner.environment or {}),
            "PYTHONNOUSERSITE": "1",
            "QUANTUM_PLATFORM_EXECUTION_MODE": "burst",
            "QUANTUM_PLATFORM_USERNAME": spawner.user.name,
        }

    c.Spawner.pre_spawn_hook = apply_platform_identity

    # The portal gets a Hub service token, not Kubernetes credentials.
    c.JupyterHub.services = [
        {
            "name": "quantum-platform",
            "api_token": platform_api_token,
        },
        {
            "name": "idle-culler",
            "command": [
                "python",
                "-m",
                "jupyterhub_idle_culler",
                "--timeout=14400",
                "--cull-every=600",
            ],
        },
    ]

    c.JupyterHub.load_roles = [
        {
            "name": "quantum-platform-workbench-manager",
            "services": ["quantum-platform"],
            "scopes": ["admin:users", "admin:servers"],
        },
        {
            "name": "idle-culler",
            "services": ["idle-culler"],
            "scopes": ["list:users", "read:users:activity", "servers"],
        },
    ]
