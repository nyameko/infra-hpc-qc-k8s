apiVersion: v1
kind: ResourceQuota
metadata:
  name: jupyterhub-m2a-budget
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 8Gi
    limits.cpu: "10"
    limits.memory: 24Gi
    pods: "8"
    persistentvolumeclaims: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: jupyterhub-container-defaults
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: "2"
        memory: 4Gi
      max:
        cpu: "2"
        memory: 4Gi
