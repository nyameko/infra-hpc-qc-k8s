apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-control-plane-personal-worker
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  replicas: 1
  # The worker holds a PostgreSQL advisory lock for singleton execution.
  # RollingUpdate creates a second Pod before terminating the first, which
  # immediately exits because it cannot acquire that lock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/part-of: agent-control-plane
      acp-role: personal-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: agent-control-plane
        app.kubernetes.io/component: personal-agent-worker
        acp-role: personal-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      # This Deployment is owned by a separate auto-syncing Application.
      # Do not start a new harness image until the parent app's migration hook
      # has brought PostgreSQL to the schema packaged inside that image.
      initContainers:
      - name: wait-for-acp-schema
        image: ghcr.io/nyameko/agent-control-plane-hermes@sha256:6ec37a755e57ef868a2fcce6052535588d14742bc85df75ab973dae811f1bdda
        command:
        - python
        - -c
        - |
          import os
          import time
          import psycopg
          from agent_control_plane.migrate import MIGRATIONS
          expected = max(version for version, _ in MIGRATIONS)
          dsn = os.environ["ACP_DATABASE_URL"]
          for _ in range(60):
              try:
                  with psycopg.connect(dsn, connect_timeout=5) as conn:
                      actual = conn.execute(
                          "SELECT COALESCE(MAX(version), 0) FROM acp1.schema_version"
                      ).fetchone()[0]
                  if actual >= expected:
                      break
              except psycopg.Error:
                  pass
              time.sleep(10)
          else:
              raise SystemExit(f"ACP schema {expected} not available; worker gated")
        env:
        - name: ACP_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: acp-db-app
              key: ACP_DATABASE_URL
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
      containers:
      - name: personal-worker
        image: ghcr.io/nyameko/agent-control-plane-hermes@sha256:6ec37a755e57ef868a2fcce6052535588d14742bc85df75ab973dae811f1bdda
        # Both personal worker and schema-check init container use the same
        # reviewed immutable Hermes digest, promoted through infra dev PR.
        imagePullPolicy: Always
        command:
        - python
        - -m
        - agent_control_plane.personal_worker
        envFrom:
        - configMapRef:
            name: acp-config
        env:
        # Gate: verify schema v6, owner-only profile hydration and memory revocation
        # before accepting this worker image in a production GitOps sync.
        - name: ACP_PERSONAL_MEMORY_ENABLED
          value: '1'
        - name: ACP_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: acp-db-app
              key: ACP_DATABASE_URL
        - name: ACP_MODEL_API_KEY
          valueFrom:
            secretKeyRef:
              name: acp-model
              key: ACP_MODEL_API_KEY
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - import os,time; assert time.time()-os.stat('/tmp/acp-personal-worker-heartbeat').st_mtime<30
          initialDelaySeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - import os,time; assert time.time()-os.stat('/tmp/acp-personal-worker-heartbeat').st_mtime<60
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 512Mi
