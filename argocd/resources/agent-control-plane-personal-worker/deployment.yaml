apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-control-plane-personal-worker
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  replicas: 1
  # The worker holds a PostgreSQL advisory lock for singleton execution.
  # RollingUpdate creates a second Pod before terminating the first, which
  # immediately exits because it cannot acquire that lock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/part-of: agent-control-plane
      acp-role: personal-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: agent-control-plane
        app.kubernetes.io/component: personal-agent-worker
        acp-role: personal-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: personal-worker
        image: ghcr.io/nyameko/agent-control-plane-hermes@sha256:73fbc34301e9cd700e6fbb5cb6ba1f46018e1a9c22a439fdda5f81c56433f9c5
        # M4b compatible build at ACP source commit dab5e4c84eac428a990fe948c21a78b41ba1c04f.
        # The feature remains OFF until a separately approved v4 migration and activation.
        imagePullPolicy: Always
        command:
        - python
        - -m
        - agent_control_plane.personal_worker
        envFrom:
        - configMapRef:
            name: acp-config
        env:
        # Release gate: promote to main ONLY after schema-v4 + ACP API verification.
        - name: ACP_PERSONAL_MEMORY_ENABLED
          value: '1'
        - name: ACP_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: acp-db-app
              key: ACP_DATABASE_URL
        - name: ACP_MODEL_API_KEY
          valueFrom:
            secretKeyRef:
              name: acp-model
              key: ACP_MODEL_API_KEY
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - import os,time; assert time.time()-os.stat('/tmp/acp-personal-worker-heartbeat').st_mtime<30
          initialDelaySeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - import os,time; assert time.time()-os.stat('/tmp/acp-personal-worker-heartbeat').st_mtime<60
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 512Mi
