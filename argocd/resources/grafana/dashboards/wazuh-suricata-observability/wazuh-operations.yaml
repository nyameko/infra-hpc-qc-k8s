apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-sec-wazuh-operations
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    k8s-sidecar-target-directory: "Wazuh and Suricata Observability"
data:
  wazuh-operations.json: |
    {
      "title": "Wazuh Operations — Indexer & Ingestion",
      "uid": "sec-wazuh-ops",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "tags": [
        "wazuh",
        "suricata",
        "security-observability",
        "indexer",
        "ingestion"
      ],
      "panels": [
        {
          "id": 1,
          "title": "What is live vs. what still needs an exporter",
          "type": "text",
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "These panels use existing **Kubernetes/kubelet/cAdvisor** telemetry for the Wazuh Indexer and Dashboard. They do not assert that the host-level Wazuh Manager or Filebeat is healthy. The Manager runs on edge; Filebeat also runs on edge. Neither currently exposes an authenticated, scraped Prometheus target.\n\n**Pending instrumentation:** OpenSearch JVM heap/GC and cluster/shard health (authenticated exporter), Filebeat publishing failures/queue, Wazuh Manager systemd health, agent connected counts. The Manager CLI independently verified 14 Active identities on 23 September 2026; that observation is *not* a live Grafana metric."
          }
        },
        {
          "id": 2,
          "title": "Indexer container ready",
          "type": "stat",
          "description": "Kubernetes container readiness; TCP readiness is not a cluster-health API check.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_container_status_ready{namespace=\"wazuh\",container=\"wazuh-indexer\"})",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value"
          }
        },
        {
          "id": 3,
          "title": "Wazuh Dashboard replicas available",
          "type": "stat",
          "description": "",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_deployment_status_replicas_available{namespace=\"wazuh\",deployment=\"wazuh-dashboard\"})",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value"
          }
        },
        {
          "id": 4,
          "title": "Indexer PVC bound",
          "type": "stat",
          "description": "",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_persistentvolumeclaim_status_phase{namespace=\"wazuh\",persistentvolumeclaim=\"data-wazuh-indexer-0\",phase=\"Bound\"})",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value"
          }
        },
        {
          "id": 5,
          "title": "Indexer container restarts (1h)",
          "type": "stat",
          "description": "",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"wazuh\",container=\"wazuh-indexer\"}[1h]))",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value"
          }
        },
        {
          "id": 6,
          "title": "Indexer CPU usage",
          "type": "timeseries",
          "description": "",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(pod) (rate(container_cpu_usage_seconds_total{namespace=\"wazuh\",container=\"wazuh-indexer\",image!=\"\"}[5m]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores"
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "title": "Indexer working-set memory",
          "type": "timeseries",
          "description": "",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(pod) (container_memory_working_set_bytes{namespace=\"wazuh\",container=\"wazuh-indexer\",image!=\"\"})",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "title": "Indexer PVC used (if kubelet volume stats are exposed)",
          "type": "timeseries",
          "description": "No data if the CSI driver/kubelet does not expose usage.",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 19
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kubelet_volume_stats_used_bytes{namespace=\"wazuh\",persistentvolumeclaim=\"data-wazuh-indexer-0\"}",
              "legendFormat": "{{persistentvolumeclaim}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          }
        },
        {
          "id": 9,
          "title": "Indexer PVC capacity (if kubelet volume stats are exposed)",
          "type": "timeseries",
          "description": "20Gi PVC request alone is not actual free storage; no data is not zero.",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 19
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kubelet_volume_stats_capacity_bytes{namespace=\"wazuh\",persistentvolumeclaim=\"data-wazuh-indexer-0\"}",
              "legendFormat": "{{persistentvolumeclaim}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          }
        },
        {
          "id": 10,
          "title": "Next: index and ingest observability",
          "type": "text",
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 26
          },
          "options": {
            "mode": "markdown",
            "content": "Add authenticated Indexer metrics for heap, GC, cluster state, shard count and indexing failures. Add *host-level* edge service and Filebeat metrics without publicly exposing management/debug endpoints. Join data-source labels to clear `edge`, `wazuh-indexer-0` and `wazuh-dashboard` identities.\n\nAlert before disk saturation. Cinder persistence alone is not a tested Indexer snapshot/restore strategy (issue #15)."
          }
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      }
    }
