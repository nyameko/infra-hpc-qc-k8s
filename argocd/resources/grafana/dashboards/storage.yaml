apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-storage
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  storage.json: |
    {
      "title": "Storage / Kubernetes",
      "uid": "storage",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "tags": [
        "storage",
        "kubernetes",
        "cinder"
      ],
      "panels": [
        {
          "id": 1,
          "title": "PVCs Bound",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_persistentvolumeclaim_status_phase{phase=\"Bound\"})",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "PVCs Pending",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_persistentvolumeclaim_status_phase{phase=\"Pending\"})",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "PVC Requested Capacity",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_persistentvolumeclaim_resource_requests_storage_bytes)",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "PV Capacity",
          "type": "stat",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_persistentvolume_capacity_bytes)",
              "legendFormat": ""
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "title": "PVC Requested Capacity by Namespace",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(namespace) (kube_persistentvolumeclaim_resource_requests_storage_bytes)",
              "legendFormat": "{{namespace}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "title": "PVCs by Storage Class",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count by(storageclass) (kube_persistentvolume_info)",
              "legendFormat": "{{storageclass}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "title": "PV Capacity by Storage Class",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(storageclass) (kube_persistentvolume_capacity_bytes)",
              "legendFormat": "{{storageclass}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "title": "PVC Phase",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(namespace,phase) (kube_persistentvolume_status_phase)",
              "legendFormat": "{{namespace}} {{phase}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          }
        },
        {
          "id": 9,
          "title": "PVC Requested Capacity by Claim",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 19
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_persistentvolumeclaim_resource_requests_storage_bytes",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          }
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      }
    }
