apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-slurm-hosts
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    k8s-sidecar-target-directory: "Slurm"
data:
  slurm-hosts.json: |
    {
      "title":"Slurm — CPU Host Infrastructure",
      "uid":"slurm-cpu-hosts-m1",
      "schemaVersion":39,
      "version":1,
      "refresh":"30s",
      "tags":["slurm","cpu","openstack","m1"],
      "time":{"from":"now-6h","to":"now"},
      "panels":[
        {"id":1,"type":"stat","title":"Exporters UP","gridPos":{"h":5,"w":8,"x":0,"y":0},"targets":[{"refId":"A","expr":"sum(up{job=\"slurm-hosts\"}) or vector(0)"}],"options":{"reduceOptions":{"calcs":["lastNotNull"],"values":false}}},
        {"id":2,"type":"stat","title":"Exporters DOWN","gridPos":{"h":5,"w":8,"x":8,"y":0},"targets":[{"refId":"A","expr":"sum(up{job=\"slurm-hosts\"} == 0) or vector(0)"}],"options":{"reduceOptions":{"calcs":["lastNotNull"],"values":false}}},
        {"id":3,"type":"stat","title":"Exporters discovered (expected 7)","gridPos":{"h":5,"w":8,"x":16,"y":0},"targets":[{"refId":"A","expr":"count(up{job=\"slurm-hosts\"}) or vector(0)"}],"options":{"reduceOptions":{"calcs":["lastNotNull"],"values":false}}},
        {"id":4,"type":"timeseries","title":"CPU busy (%) by host","gridPos":{"h":8,"w":12,"x":0,"y":5},"targets":[{"refId":"A","expr":"100 * (1 - avg by(instance) (rate(node_cpu_seconds_total{job=\"slurm-hosts\",mode=\"idle\"}[5m])))","legendFormat":"{{instance}}"}],"fieldConfig":{"defaults":{"unit":"percent"}}},
        {"id":5,"type":"timeseries","title":"RAM used (%) by host","gridPos":{"h":8,"w":12,"x":12,"y":5},"targets":[{"refId":"A","expr":"100 * (1 - node_memory_MemAvailable_bytes{job=\"slurm-hosts\"} / node_memory_MemTotal_bytes{job=\"slurm-hosts\"})","legendFormat":"{{instance}}"}],"fieldConfig":{"defaults":{"unit":"percent"}}}
      ],
      "templating":{"list":[]},
      "annotations":{"list":[]}
    }
