apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-hpc-storage-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    k8s-sidecar-target-directory: "Storage"
data:
  hpc-storage-overview.json: |
    {
      "title": "Overview & Capacity",
      "uid": "hpc-storage-overview",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "30s",
      "tags": ["storage", "nfs", "xfs", "cinder", "m1"],
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Storage exporter UP",
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0},
          "targets": [{"refId": "A", "expr": "max(up{job=\"storage-hosts\"}) or vector(0)"}],
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Filesystem utilization (%)",
          "gridPos": {"h": 8, "w": 18, "x": 6, "y": 0},
          "targets": [{"refId": "A", "expr": "100 * (1 - node_filesystem_avail_bytes{job=\"storage-hosts\",fstype=\"xfs\",mountpoint=~\"/srv/(home|datasets|staging)\"} / node_filesystem_size_bytes{job=\"storage-hosts\",fstype=\"xfs\",mountpoint=~\"/srv/(home|datasets|staging)\"})", "legendFormat": "{{mountpoint}}"}],
          "fieldConfig": {"defaults": {"unit": "percent"}}
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Free capacity",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [{"refId": "A", "expr": "node_filesystem_avail_bytes{job=\"storage-hosts\",fstype=\"xfs\",mountpoint=~\"/srv/(home|datasets|staging)\"}", "legendFormat": "{{mountpoint}}"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}}
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Inode utilization (%)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "targets": [{"refId": "A", "expr": "100 * (1 - node_filesystem_files_free{job=\"storage-hosts\",fstype=\"xfs\",mountpoint=~\"/srv/(home|datasets|staging)\"} / node_filesystem_files{job=\"storage-hosts\",fstype=\"xfs\",mountpoint=~\"/srv/(home|datasets|staging)\"})", "legendFormat": "{{mountpoint}}"}],
          "fieldConfig": {"defaults": {"unit": "percent"}}
        }
      ],
      "templating": {"list": []},
      "annotations": {"list": []}
    }
