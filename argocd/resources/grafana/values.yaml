replicas: 1

deploymentStrategy:
  type: Recreate

admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

persistence:
  enabled: true
  type: pvc
  storageClassName: cinder-ssd
  accessModes:
    - ReadWriteOnce
  size: 10Gi

service:
  type: ClusterIP


grafana.ini:
  server:
    domain: grafana.quantum.nyameko.com
    root_url: https://grafana.quantum.nyameko.com


ingress:
  enabled: true
  ingressClassName: traefik

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare

  hosts:
    - grafana.quantum.nyameko.com

  path: /
  pathType: Prefix

  tls:
    - secretName: grafana-tls
      hosts:
        - grafana.quantum.nyameko.com

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

serviceMonitor:
  enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
        editable: false

sidecar:
  dashboards:
    enabled: true
    SCProvider: true
    label: grafana_dashboard
    labelValue: "1"

    provider:
      name: gitops-dashboards
      orgid: 1
      folder: ""
      type: file
      disableDelete: false
      allowUiUpdates: false
      foldersFromFilesStructure: true
