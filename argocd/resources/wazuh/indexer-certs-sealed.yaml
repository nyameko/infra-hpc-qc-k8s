apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: indexer-certs
  namespace: wazuh
  annotations:
    argocd.argoproj.io/sync-wave: "-1"

spec:
  encryptedData:
    root-ca.pem: %
    node.pem: %
    node-key.pem: %
    admin.pem: %
    admin-key.pem: %

  template:
    metadata:
      name: indexer-certs
      namespace: wazuh
    type: Opaque
