apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperclip-pilot
  labels:
    app.kubernetes.io/name: paperclip
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperclip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperclip
    spec:
      # Pilot never inherits kubeconfig or a mounted ServiceAccount token.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: paperclip
          # Candidate immutable VERSION TAG from upstream 2026-11-06 release.
          # Resolve, inspect and pin the official OCI sha256 manifest digest
          # BEFORE human-approved first sync; never use latest or cloud image.
          image: ghcr.io/paperclipai/paperclip:2026.1106.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3100
          env:
            - {name: HOST, value: "0.0.0.0"}
            - {name: PORT, value: "3100"}
            - {name: PAPERCLIP_HOME, value: "/paperclip"}
            - {name: PAPERCLIP_DEPLOYMENT_MODE, value: "authenticated"}
            - {name: PAPERCLIP_DEPLOYMENT_EXPOSURE, value: "private"}
            # SSH/kubectl port-forward only. No DNS, TLS ingress or public URL.
            - {name: PAPERCLIP_PUBLIC_URL, value: "http://localhost:3100"}
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: paperclip-pilot-auth
                  key: BETTER_AUTH_SECRET
            - name: PAPERCLIP_TOOL_ACTION_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: paperclip-pilot-auth
                  key: PAPERCLIP_TOOL_ACTION_SIGNING_SECRET
            # A restricted LiteLLM *virtual key*, never the gateway master key;
            # optional so the private UI can boot before agent activation.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: paperclip-pilot-model
                  key: OPENAI_API_KEY
                  optional: true
            - name: OPENAI_BASE_URL
              value: http://litellm.litellm.svc.cluster.local:4000/v1
          volumeMounts:
            - name: data
              mountPath: /paperclip
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            # readOnlyRootFilesystem intentionally deferred: verify upstream
            # startup/writable paths with the operator, then tighten.
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 5Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperclip-pilot-data
---
apiVersion: v1
kind: Service
metadata:
  name: paperclip-pilot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: paperclip
  ports:
    - {name: http, port: 3100, targetPort: http}
