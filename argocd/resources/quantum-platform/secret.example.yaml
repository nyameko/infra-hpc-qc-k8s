# EXAMPLE ONLY.
#
# Never commit real values.
# This file is intentionally excluded from kustomization.yaml.
#
apiVersion: v1
kind: Secret
metadata:
  name: quantum-platform-secrets
  namespace: quantum-platform
type: Opaque
stringData:
  DJANGO_SECRET_KEY: REPLACE_ME
  POSTGRES_PASSWORD: REPLACE_ME

  # Optional one-time/idempotent platform-admin bootstrap.
  # Keep the real email in the SealedSecret, never in public Git.
  QUANTUM_PLATFORM_BOOTSTRAP_ADMIN_EMAIL: REPLACE_ME

  # M3b JupyterHub identity/control-plane integration.
  # These must match the values sealed into jupyterhub-workbench-platform.
  JUPYTERHUB_API_TOKEN: REPLACE_ME
  JUPYTERHUB_LAUNCH_SIGNING_KEY: REPLACE_ME

  # M3c restricted forced-command SSH gateway. The matching public key belongs
  # in protected Ansible inventory as jupyterhub_gateway_public_key.
  SLURM_GATEWAY_PRIVATE_KEY: |-
    -----BEGIN OPENSSH PRIVATE KEY-----
    REPLACE_ME
    -----END OPENSSH PRIVATE KEY-----
  SLURM_GATEWAY_KNOWN_HOSTS: "slurm-login.internal ssh-ed25519 REPLACE_ME"
