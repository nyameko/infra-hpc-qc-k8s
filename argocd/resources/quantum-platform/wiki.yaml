apiVersion: v1
kind: Service
metadata:
  name: quantum-platform-wiki
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app.kubernetes.io/name: quantum-platform-wiki

  ports:
    - name: http
      port: 8080
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantum-platform-wiki
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: quantum-platform-wiki

  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantum-platform-wiki
        app.kubernetes.io/part-of: quantum-platform

    spec:
      containers:
        - name: wiki
          image: quantum-platform-wiki
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /healthz
              port: http

            initialDelaySeconds: 2
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /healthz
              port: http

            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: 20m
              memory: 32Mi

            limits:
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
