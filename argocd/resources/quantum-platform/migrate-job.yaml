apiVersion: batch/v1
kind: Job
metadata:
  name: quantum-platform-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6

  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantum-platform-migrate
        app.kubernetes.io/part-of: quantum-platform

    spec:
      restartPolicy: Never

      containers:
        - name: migrate
          image: quantum-platform-user-api
          imagePullPolicy: Always

          command:
            - python
            - manage.py
            - migrate
            - --noinput

          envFrom:
            - configMapRef:
                name: quantum-platform-config

            - secretRef:
                name: quantum-platform-secrets
