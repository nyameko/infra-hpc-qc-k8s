apiVersion: batch/v1
kind: Job
metadata:
  name: quantum-platform-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 6

  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantum-platform-migrate
        app.kubernetes.io/part-of: quantum-platform

    spec:
      restartPolicy: Never

      containers:
        - name: migrate
          image: quantum-platform-user-api
          imagePullPolicy: Always

          command:
            - /bin/sh
            - -lc
            - |
              set -eu
              python manage.py migrate --noinput

              if [ -n "${QUANTUM_PLATFORM_BOOTSTRAP_ADMIN_USERNAME:-}" ] && \
                 [ -n "${QUANTUM_PLATFORM_BOOTSTRAP_ADMIN_EMAIL:-}" ]; then
                python manage.py ensure_platform_admin \
                  --username "${QUANTUM_PLATFORM_BOOTSTRAP_ADMIN_USERNAME}" \
                  --email "${QUANTUM_PLATFORM_BOOTSTRAP_ADMIN_EMAIL}" \
                  --apply
              else
                echo "Platform administrator bootstrap not configured; skipping."
              fi

          envFrom:
            - configMapRef:
                name: quantum-platform-config

            - secretRef:
                name: quantum-platform-secrets
