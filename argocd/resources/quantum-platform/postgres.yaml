apiVersion: v1
kind: Service
metadata:
  name: quantum-platform-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  clusterIP: None

  selector:
    app.kubernetes.io/name: quantum-platform-postgres

  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: quantum-platform-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: quantum-platform-postgres
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: quantum-platform-postgres

  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantum-platform-postgres
        app.kubernetes.io/part-of: quantum-platform

    spec:
      containers:
        - name: postgres
          image: postgres:18
          imagePullPolicy: IfNotPresent

          ports:
            - name: postgres
              containerPort: 5432

          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: quantum-platform-config
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: quantum-platform-config
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quantum-platform-secrets
                  key: POSTGRES_PASSWORD

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  pg_isready
                  -U "$POSTGRES_USER"
                  -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  pg_isready
                  -U "$POSTGRES_USER"
                  -d "$POSTGRES_DB"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              memory: 1Gi

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql

  volumeClaimTemplates:
    - metadata:
        name: data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 20Gi
