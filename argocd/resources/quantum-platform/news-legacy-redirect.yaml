# Keep existing bookmarks working. The canonical news route has its own
# ingress and TLS; this legacy hostname permanently redirects to it.
# Verify Cloudflare DNS, cert-manager certificate and Traefik middleware CRD
# before main promotion. Never redirect the authenticated Quantum portal.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: news-legacy-redirect
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  redirectRegex:
    regex: '^https?://blog\.nyameko\.com/(.*)$'
    replacement: 'https://news.quantum.nyameko.com/${1}'
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quantum-platform-news-legacy
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    traefik.ingress.kubernetes.io/router.middlewares: quantum-platform-news-legacy-redirect@kubernetescrd
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - blog.nyameko.com
      secretName: quantum-platform-news-legacy-tls
  rules:
    - host: blog.nyameko.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quantum-platform-blog
                port:
                  number: 8080
