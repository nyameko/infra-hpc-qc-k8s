apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: quantum-platform

resources:
  - namespace.yaml
  - configmap.yaml
  - quantum-platform-secrets-sealed.yaml
  - quantum-platform-jupyterhub-sealed.yaml
  - quantum-platform-slurm-gateway-sealed.yaml
  - acp-signing-sealed.yaml
  - postgres.yaml
  - migrate-job.yaml
  - blog.yaml
  - users.yaml
  - user-api.yaml
  - ingress.yaml
  - postgres-exporter.yaml
  - admin-ingress.yaml

components:
  - ../../components/quantum-platform-agent-admin

images:
  - name: quantum-platform-blog
    newName: ghcr.io/nyameko/quantum-platform-blog
    newTag: dev

  - name: quantum-platform-users
    newName: ghcr.io/nyameko/quantum-platform-users
    digest: sha256:5619462d59186a54a718adad499f279665c02261dff75f80d9ac0cc9be6aa803

  - name: quantum-platform-user-api
    newName: ghcr.io/nyameko/quantum-platform-user-api
    digest: sha256:75ccae645ef296caa6bc2ebff803347f77990ad8402ef771f839953c8f4dc19b

patches:
  - target:
      group: bitnami.com
      version: v1alpha1
      kind: SealedSecret
      name: acp-signing
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
