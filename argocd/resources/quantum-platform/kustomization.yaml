apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: quantum-platform

resources:
  - namespace.yaml
  - configmap.yaml
  - quantum-platform-secrets-sealed.yaml
  - quantum-platform-jupyterhub-sealed.yaml
  - quantum-platform-slurm-gateway-sealed.yaml
  - acp-signing-sealed.yaml
  - postgres.yaml
  - migrate-job.yaml
  - blog.yaml
  - users.yaml
  - user-api.yaml
  - ingress.yaml
  - postgres-exporter.yaml
  - admin-ingress.yaml

components:
  - ../../components/quantum-platform-agent-admin

images:
  - name: quantum-platform-blog
    newName: ghcr.io/nyameko/quantum-platform-blog
    newTag: dev

  - name: quantum-platform-users
    newName: ghcr.io/nyameko/quantum-platform-users
    digest: sha256:fd406e707f54af6fbcf55ca872be3d6736ad99f0a498cecbe8a17116d5546269

  - name: quantum-platform-user-api
    newName: ghcr.io/nyameko/quantum-platform-user-api
    digest: sha256:561de764bc0b9492a38dfa79a6b6a87ffc8194606a098c520a8f10cc89bf7bbc

patches:
  - target:
      group: bitnami.com
      version: v1alpha1
      kind: SealedSecret
      name: acp-signing
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
