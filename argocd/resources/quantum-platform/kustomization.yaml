apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: quantum-platform

resources:
  - namespace.yaml
  - configmap.yaml
  - quantum-platform-secrets-sealed.yaml
  - quantum-platform-jupyterhub-sealed.yaml
  - quantum-platform-slurm-gateway-sealed.yaml
  - acp-signing-sealed.yaml
  - postgres.yaml
  - migrate-job.yaml
  - blog.yaml
  - users.yaml
  - user-api.yaml
  - ingress.yaml
  - postgres-exporter.yaml
  - admin-ingress.yaml

components:
  - ../../components/quantum-platform-agent-admin

images:
  - name: quantum-platform-blog
    newName: ghcr.io/nyameko/quantum-platform-blog
    newTag: dev

  - name: quantum-platform-users
    newName: ghcr.io/nyameko/quantum-platform-users
    digest: sha256:44b0ef2d1ca2d265f367cfa9b4f7acc0a376cb0fedb6e71a2f06bb83a582aa54

  - name: quantum-platform-user-api
    newName: ghcr.io/nyameko/quantum-platform-user-api
    digest: sha256:86f5cba386f4647e70671023686cdce454909e3a52a81fcc8f6057eaaec7ce2d

patches:
  - target:
      group: bitnami.com
      version: v1alpha1
      kind: SealedSecret
      name: acp-signing
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
