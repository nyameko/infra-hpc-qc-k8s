apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: quantum-platform

resources:
  - namespace.yaml
  - configmap.yaml
  - quantum-platform-secrets-sealed.yaml
  - quantum-platform-jupyterhub-sealed.yaml
  - quantum-platform-slurm-gateway-sealed.yaml
  - acp-signing-sealed.yaml
  - postgres.yaml
  - migrate-job.yaml
  - blog.yaml
  - users.yaml
  - user-api.yaml
  - ingress.yaml
  - postgres-exporter.yaml
  - admin-ingress.yaml

components:
  - ../../components/quantum-platform-agent-admin

images:
  - name: quantum-platform-blog
    newName: ghcr.io/nyameko/quantum-platform-blog
    newTag: dev

  - name: quantum-platform-users
    newName: ghcr.io/nyameko/quantum-platform-users
    digest: sha256:6465f01069c8a2a5f8660018edcb2152ac38c23f8658818f03d82503c334be77

  - name: quantum-platform-user-api
    newName: ghcr.io/nyameko/quantum-platform-user-api
    digest: sha256:db0cd634e44bf6e85b3b0ef2489961398a34fc70ab015c3a8dacf9cb3128f15a

patches:
  - target:
      group: bitnami.com
      version: v1alpha1
      kind: SealedSecret
      name: acp-signing
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
