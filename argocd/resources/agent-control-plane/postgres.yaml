apiVersion: v1
kind: Service
metadata:
  name: agent-control-plane-postgres
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/part-of: agent-control-plane
    acp-role: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-control-plane-postgres
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  serviceName: agent-control-plane-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: agent-control-plane
      acp-role: postgres
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: agent-control-plane
        acp-role: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:18
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: agent_control_plane
        - name: POSTGRES_USER
          value: acp_owner
        - name: PGDATA
          value: /var/lib/postgresql/18/docker
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: acp-db-owner
              key: POSTGRES_PASSWORD
        - name: ACP_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: acp-db-app
              key: ACP_APP_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql
        - name: bootstrap
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        - name: run
          mountPath: /var/run/postgresql
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - acp_owner
            - -d
            - agent_control_plane
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
      volumes:
      - name: bootstrap
        configMap:
          name: acp-postgres-bootstrap
          defaultMode: 365
      - name: run
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
      annotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: cinder-agent-retain
      resources:
        requests:
          storage: 20Gi
