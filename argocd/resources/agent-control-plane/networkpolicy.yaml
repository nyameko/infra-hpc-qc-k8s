apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acp-default-deny
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acp-dns
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acp-api-from-platform
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: agent-control-plane
      acp-role: api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: quantum-platform
      podSelector:
        matchLabels:
          app.kubernetes.io/name: quantum-platform-user-api
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acp-database-ingress
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: agent-control-plane
      acp-role: postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: acp-role
          operator: In
          values:
          - api
          - worker
          - migration
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acp-database-egress
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  podSelector:
    matchExpressions:
    - key: acp-role
      operator: In
      values:
      - api
      - worker
      - migration
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: agent-control-plane
          acp-role: postgres
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acp-prometheus-egress
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: agent-control-plane
      acp-role: worker
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
          app.kubernetes.io/component: server
    ports:
    - protocol: TCP
      port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acp-model-egress
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: agent-control-plane
      acp-role: worker
  policyTypes:
  - Egress
  egress: []
