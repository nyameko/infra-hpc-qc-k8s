apiVersion: v1
kind: Service
metadata:
  name: agent-control-plane-hermes
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/part-of: agent-control-plane
    acp-role: worker
  ports:
  - name: unused
    port: 8081
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-control-plane-hermes
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  serviceName: agent-control-plane-hermes
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: agent-control-plane
      acp-role: worker
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: agent-control-plane
        acp-role: worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: hermes-worker
        image: agent-control-plane-hermes
        command:
        - python
        - -m
        - agent_control_plane.worker
        envFrom:
        - configMapRef:
            name: acp-config
        env:
        - name: ACP_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: acp-db-app
              key: ACP_DATABASE_URL
        - name: ACP_MODEL_API_KEY
          valueFrom:
            secretKeyRef:
              name: acp-model
              key: ACP_MODEL_API_KEY
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: profile
          mountPath: /var/lib/hermes
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - import os,time; assert time.time()-os.stat('/tmp/acp-worker-heartbeat').st_mtime<30
          initialDelaySeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - import os,time; assert time.time()-os.stat('/tmp/acp-worker-heartbeat').st_mtime<60
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
  volumeClaimTemplates:
  - metadata:
      name: profile
      annotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: cinder-agent-retain
      resources:
        requests:
          storage: 10Gi
