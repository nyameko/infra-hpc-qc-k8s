apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-control-plane

resources:
  - namespace.yaml

  # M4a sealed credentials
  - acp-db-owner-sealed.yaml
  - acp-db-app-sealed.yaml
  - acp-verification-sealed.yaml
  - acp-model-sealed.yaml

  - configmap.yaml
  - networkpolicy.yaml
  - storage.yaml
  - postgres-bootstrap.yaml
  - postgres.yaml
  - migrate-job.yaml
  - api.yaml
  - hermes.yaml

images:
- name: agent-control-plane-api
  newName: ghcr.io/nyameko/agent-control-plane
  digest: sha256:750b0ceb03fc3d09ef71063b5424716f14944df7be082485689dba6f2ff68f1c
- name: agent-control-plane-hermes
  newName: ghcr.io/nyameko/agent-control-plane-hermes
  digest: sha256:6ec37a755e57ef868a2fcce6052535588d14742bc85df75ab973dae811f1bdda

patches:
- target:
    group: bitnami.com
    version: v1alpha1
    kind: SealedSecret
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        argocd.argoproj.io/sync-wave: "-3"
