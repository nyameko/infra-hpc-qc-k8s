apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-control-plane
resources:
- api.yaml
- configmap.yaml
- hermes.yaml
- migrate-job.yaml
- namespace.yaml
- networkpolicy.yaml
- postgres-bootstrap.yaml
- postgres.yaml
- storage.yaml
images:
- name: agent-control-plane-api
  newName: ghcr.io/nyameko/agent-control-plane
  newTag: REPLACE_WITH_TESTED_SHA
- name: agent-control-plane-hermes
  newName: ghcr.io/nyameko/agent-control-plane-hermes
  newTag: REPLACE_WITH_TESTED_SHA
