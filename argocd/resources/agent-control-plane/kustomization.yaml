apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-control-plane

resources:
  - namespace.yaml

  # M4a sealed credentials
  - acp-db-owner-sealed.yaml
  - acp-db-app-sealed.yaml
  - acp-verification-sealed.yaml
  - acp-model-sealed.yaml

  - configmap.yaml
  - networkpolicy.yaml
  - storage.yaml
  - postgres-bootstrap.yaml
  - postgres.yaml
  - migrate-job.yaml
  - api.yaml
  - hermes.yaml

images:
- name: agent-control-plane-api
  newName: ghcr.io/nyameko/agent-control-plane
  digest: sha256:b1289eab095fae443979d10ca1d5a27e8111a7689ddb346cb76ea7217e945bc4
- name: agent-control-plane-hermes
  newName: ghcr.io/nyameko/agent-control-plane-hermes
  digest: sha256:609dd6a8c14fa9182a0fe6962873fde2a53e1b2efd6bd0eaaccce115692d4b7a

patches:
- target:
    group: bitnami.com
    version: v1alpha1
    kind: SealedSecret
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        argocd.argoproj.io/sync-wave: "-3"
