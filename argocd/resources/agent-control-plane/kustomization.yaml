apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-control-plane

resources:
  - namespace.yaml

  # M4a sealed credentials
  - acp-db-owner-sealed.yaml
  - acp-db-app-sealed.yaml
  - acp-verification-sealed.yaml
  - acp-model-sealed.yaml

  - configmap.yaml
  - networkpolicy.yaml
  - storage.yaml
  - postgres-bootstrap.yaml
  - postgres.yaml
  - migrate-job.yaml
  - api.yaml
  - hermes.yaml

images:
- name: agent-control-plane-api
  newName: ghcr.io/nyameko/agent-control-plane
  digest: sha256:0b29d549c5aae9eda8737cbb5f065c9c83f0367e8641134b0a01de7c0fe41cfb
- name: agent-control-plane-hermes
  newName: ghcr.io/nyameko/agent-control-plane-hermes
  digest: sha256:2b2c6ae40496050b198049aa8f00c239522f2767ebae959876d65899b4d67586

patches:
- target:
    group: bitnami.com
    version: v1alpha1
    kind: SealedSecret
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        argocd.argoproj.io/sync-wave: "-3"
