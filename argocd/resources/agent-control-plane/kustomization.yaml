apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-control-plane

resources:
  - namespace.yaml

  # M4a sealed credentials
  - acp-db-owner-sealed.yaml
  - acp-db-app-sealed.yaml
  - acp-verification-sealed.yaml
  - acp-model-sealed.yaml

  - configmap.yaml
  - networkpolicy.yaml
  - storage.yaml
  - postgres-bootstrap.yaml
  - postgres.yaml
  - migrate-job.yaml
  - api.yaml
  - hermes.yaml

images:
- name: agent-control-plane-api
  newName: ghcr.io/nyameko/agent-control-plane
  digest: sha256:17911f1a919f3a3f25424c4db4949e7bbcb1d4be022c571fb00d9f24f56d0eaa
- name: agent-control-plane-hermes
  newName: ghcr.io/nyameko/agent-control-plane-hermes
  digest: sha256:876bc6877b85160dc78e265ac5311dcfbeb86e381080da484f12f4aa749df30e

patches:
- target:
    group: bitnami.com
    version: v1alpha1
    kind: SealedSecret
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        argocd.argoproj.io/sync-wave: "-3"
