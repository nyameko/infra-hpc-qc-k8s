apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-control-plane

resources:
  - namespace.yaml

  # M4a sealed credentials
  - acp-db-owner-sealed.yaml
  - acp-db-app-sealed.yaml
  - acp-verification-sealed.yaml
  - acp-model-sealed.yaml

  - configmap.yaml
  - networkpolicy.yaml
  - storage.yaml
  - postgres-bootstrap.yaml
  - postgres.yaml
  - migrate-job.yaml
  - api.yaml
  - hermes.yaml

images:
- name: agent-control-plane-api
  newName: ghcr.io/nyameko/agent-control-plane
  digest: sha256:988046302b8bc2ebfd59ab63deb1c137f23173d1bab76a6991170aba714a7fd2
- name: agent-control-plane-hermes
  newName: ghcr.io/nyameko/agent-control-plane-hermes
  digest: sha256:7ba81aab4fc4df5ee4f2bf23e8b0051604ecd33c44e6bf34cbfa0c69f41b3863

patches:
- target:
    group: bitnami.com
    version: v1alpha1
    kind: SealedSecret
  patch: |-
    - op: add
      path: /metadata/annotations
      value:
        argocd.argoproj.io/sync-wave: "-3"
