apiVersion: v1
kind: ConfigMap
metadata:
  name: acp-postgres-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
data:
  10-app-role.sh: "#!/bin/sh\nset -eu\npsql --username \"$POSTGRES_USER\" --dbname\
    \ \"$POSTGRES_DB\" \\\n  --set=ON_ERROR_STOP=1 --set=app_password=\"$ACP_APP_PASSWORD\"\
    \ <<'SQL'\nSELECT format('CREATE ROLE acp_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE\
    \ NOINHERIT NOBYPASSRLS PASSWORD %L', :'app_password') \\gexec\nREVOKE CREATE\
    \ ON SCHEMA public FROM PUBLIC;\nGRANT CONNECT ON DATABASE agent_control_plane\
    \ TO acp_app;\nSQL\n"
