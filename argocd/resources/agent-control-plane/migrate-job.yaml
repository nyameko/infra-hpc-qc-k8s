apiVersion: batch/v1
kind: Job
metadata:
  name: acp-migrate
  annotations:
    argocd.argoproj.io/sync-wave: '1'
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  # A rejected or failed release must fail once, not flap for 15 minutes.
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: agent-control-plane
        acp-role: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate
        image: agent-control-plane-api
        # Check the live schema against the operator-approved automatic migration
        # ceiling BEFORE running the existing checksum-checked migration driver.
        # A newer schema release requires a separately reviewed backup/approval.
        command:
        - python
        - -c
        - |
          import os
          import psycopg
          from agent_control_plane.migrate import MIGRATIONS, migrate
          desired = max(version for version, _ in MIGRATIONS)
          approved = int(os.environ["ACP_APPROVED_MIGRATION_VERSION"])
          dsn = os.environ["ACP_MIGRATION_DATABASE_URL"]
          with psycopg.connect(dsn, connect_timeout=5) as conn:
              current = conn.execute(
                  "SELECT COALESCE(MAX(version), 0) FROM acp1.schema_version"
              ).fetchone()[0]
          if current < desired and desired > approved:
              raise SystemExit(
                  f"Schema upgrade {current}->{desired} requires separately "
                  f"approved migration (automatic ceiling {approved})"
              )
          migrate(dsn)
        env:
        # RELEASE GATE: raise only after off-PVC backup, isolated restore,
        # reviewed migrations 0005-0008 and explicit owner approval.
        # This branch is a candidate; a merged DEV PR does not approve
        # promoting it to MAIN (which automatically launches this hook).
        - name: ACP_APPROVED_MIGRATION_VERSION
          value: '8'
        - name: ACP_MIGRATION_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: acp-db-owner
              key: ACP_MIGRATION_DATABASE_URL
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
