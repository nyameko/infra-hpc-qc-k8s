apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-control-plane-personal-worker
  annotations:
    argocd.argoproj.io/sync-wave: '2'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: agent-control-plane
      acp-role: personal-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: agent-control-plane
        app.kubernetes.io/component: personal-agent-worker
        acp-role: personal-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: personal-worker
        image: agent-control-plane-hermes
        command:
        - python
        - -m
        - agent_control_plane.personal_worker
        envFrom:
        - configMapRef:
            name: acp-config
        env:
        - name: ACP_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: acp-db-app
              key: ACP_DATABASE_URL
        - name: ACP_MODEL_API_KEY
          valueFrom:
            secretKeyRef:
              name: acp-model
              key: ACP_MODEL_API_KEY
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - import os,time; assert time.time()-os.stat('/tmp/acp-personal-worker-heartbeat').st_mtime<30
          initialDelaySeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - import os,time; assert time.time()-os.stat('/tmp/acp-personal-worker-heartbeat').st_mtime<60
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 512Mi
