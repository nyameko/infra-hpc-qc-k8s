deployment:
  kind: DaemonSet

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

ports:
  web:
    port: 80
    exposedPort: 80
    containerPort: 80
    hostPort: 80
    expose:
      default: true

    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    port: 443
    exposedPort: 443
    containerPort: 443
    hostPort: 443
    expose:
      default: true

    http:
      tls:
        enabled: true

service:
  enabled: true
  spec:
    type: ClusterIP

providers:
  kubernetesCRD:
    enabled: true

  kubernetesIngress:
    enabled: true

    publishedService:
      enabled: false

    ingressEndpoint:
      ip: 10.51.0.100

securityContext:
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
  allowPrivilegeEscalation: false

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
metrics:
  prometheus:
    addRoutersLabels: true
    addServicesLabels: true

log:
    level: INFO

accessLog:
  enabled: true
