deployment:
  kind: DaemonSet

ports:
  web:
    port: 80
    exposedPort: 80
    containerPort: 80
    hostPort: 80
    expose:
      default: true

    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    port: 443
    exposedPort: 443
    containerPort: 443
    hostPort: 443
    expose:
      default: true

    http:
      tls:
        enabled: true

service:
  enabled: true
  type: ClusterIP

providers:
  kubernetesCRD:
    enabled: true

  kubernetesIngress:
    enabled: true

securityContext:
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
  allowPrivilegeEscalation: false

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist

log:
    level: INFO

accessLog:
  enabled: true
