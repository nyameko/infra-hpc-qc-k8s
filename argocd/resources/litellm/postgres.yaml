apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cinder-litellm-retain
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
provisioner: cinder.csi.openstack.org
parameters:
  type: SSD
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: litellm-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: litellm-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: litellm-postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: litellm
            - name: POSTGRES_USER
              value: litellm_owner
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-db-owner
                  key: POSTGRES_PASSWORD
            - name: LITELLM_DB_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm-db-app
                  key: LITELLM_DB_APP_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: bootstrap
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "litellm_owner", "-d", "litellm"]
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: bootstrap
          configMap:
            name: litellm-postgres-bootstrap
            defaultMode: 365
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: cinder-litellm-retain
      resources:
        requests:
          storage: 20Gi
