apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-default-deny
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-from-acp
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-control-plane
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: agent-control-plane
              acp-role: personal-worker
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agent-control-plane
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: agent-control-plane
              acp-role: worker
      ports:
        - protocol: TCP
          port: 4000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-dns
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
# Deliberately NO backend-network egress here.
# The operator must add a separate narrow, privately managed NetworkPolicy for
# the verified ACE vLLM /32 (TCP 8000) and later an H200 /32 only if authorized.
