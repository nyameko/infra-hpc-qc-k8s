apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-prisma-migrate
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prisma-migration
          # Must be identical to gateway image and pinned by digest before promotion.
          image: ghcr.io/berriai/litellm:v1.90.2
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["python", "litellm/proxy/prisma_migration.py"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-db-app
                  key: DATABASE_URL
            - name: DISABLE_SCHEMA_UPDATE
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
