apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: litellm
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres-bootstrap.yaml
  - postgres.yaml
  - migrate-job.yaml
  - networkpolicy.yaml
  - deployment.yaml
  - litellm-db-owner-sealed.yaml
  - litellm-db-app-sealed.yaml
  - litellm-credentials-sealed.yaml

patches:
  - target:
      group: bitnami.com
      version: v1alpha1
      kind: SealedSecret
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-3"
