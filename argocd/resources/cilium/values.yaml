# Project-specific Cilium configuration.
# Keep Helm chart defaults out of Git unless they are deliberate project choices.

cluster:
  name: kubernetes

operator:
  replicas: 1

routingMode: tunnel
tunnelProtocol: vxlan

kubeProxyReplacement: true
k8sServiceHost: 10.51.0.100
k8sServicePort: 6443

# Enable Cilium agent metrics for Prometheus/Grafana observability.
prometheus:
  enabled: true
