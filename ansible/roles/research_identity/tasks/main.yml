---
- name: Require explicit private research-user definitions
  ansible.builtin.assert:
    that:
      - research_users is defined
      - research_users | length > 0
    fail_msg: >-
      Supply research_users from protected/private vars. Do not commit real
      research usernames, UID/GID assignments or SSH keys to the public repo.

- name: Inspect existing research passwd entries
  ansible.builtin.command:
    cmd: "getent passwd {{ item.name }}"
  loop: "{{ research_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: research_existing_passwd
  changed_when: false
  failed_when: false

- name: Reject conflicting existing research identities
  ansible.builtin.assert:
    that:
      - item.rc != 0 or (item.stdout.split(':')[2] | int) == (item.item.uid | int)
      - item.rc != 0 or (item.stdout.split(':')[3] | int) == (item.item.gid | int)
      - item.rc != 0 or item.stdout.split(':')[5] == '/home/research/' ~ item.item.name
    fail_msg: >-
      Existing passwd entry for {{ item.item.name }} conflicts with the desired
      UID/GID/home. Resolve the identity conflict explicitly before continuing.
  loop: "{{ research_existing_passwd.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Inspect existing research group entries
  ansible.builtin.command:
    cmd: "getent group {{ item.name }}"
  loop: "{{ research_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: research_existing_groups
  changed_when: false
  failed_when: false

- name: Reject conflicting existing research groups
  ansible.builtin.assert:
    that:
      - item.rc != 0 or (item.stdout.split(':')[2] | int) == (item.item.gid | int)
    fail_msg: >-
      Existing group {{ item.item.name }} has a different GID. Resolve the
      identity conflict explicitly before continuing.
  loop: "{{ research_existing_groups.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Create research primary groups
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.gid }}"
    state: present
  loop: "{{ research_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create consistent POSIX research identities
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    group: "{{ item.name }}"
    home: "/home/research/{{ item.name }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    create_home: false
    password_lock: true
    state: present
  loop: "{{ research_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create authoritative research homes on the storage server
  ansible.builtin.file:
    path: "/srv/home/{{ item.name }}"
    state: directory
    owner: "{{ item.uid }}"
    group: "{{ item.gid }}"
    mode: "{{ item.home_mode | default('0700') }}"
  loop: "{{ research_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: "'storage_nfs' in group_names"


- name: Ensure restricted execution entitlement group exists
  ansible.builtin.group:
    name: "{{ jupyterhub_allowed_group }}"
    state: present
  when:
    - "'slurm_login' in group_names or 'slurm_compute' in group_names"

- name: Add explicitly entitled research users to Slurm gateway group
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups:
      - "{{ jupyterhub_allowed_group }}"
    append: true
  loop: "{{ research_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.execution_enabled | default(false) | bool
    - "'slurm_login' in group_names or 'slurm_compute' in group_names"

- name: Create per-user Quantum Platform state directory on storage
  ansible.builtin.file:
    path: "/srv/home/{{ item.name }}/.quantum-platform"
    state: directory
    owner: "{{ item.uid }}"
    group: "{{ item.gid }}"
    mode: "0700"
  loop: "{{ research_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: "'storage_nfs' in group_names"

- name: Create per-user durable run directory on storage
  ansible.builtin.file:
    path: "/srv/home/{{ item.name }}/.quantum-platform/runs"
    state: directory
    owner: "{{ item.uid }}"
    group: "{{ item.gid }}"
    mode: "0700"
  loop: "{{ research_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: "'storage_nfs' in group_names"

- name: Ensure bootstrap Quantum Platform Slurm account is associated with the cluster
  ansible.builtin.command:
    cmd: >-
      sacctmgr -i add account {{ jupyterhub_execution_slurm_account }}
      cluster={{ slurm_cluster_name }}
      description="Quantum Platform mediated execution"
      organization="quantum-platform"
  register: quantum_platform_slurm_account_add
  changed_when: >-
    'Nothing new added' not in quantum_platform_slurm_account_add.stdout
    and 'Nothing added' not in quantum_platform_slurm_account_add.stdout
  when: "'slurm_controller' in group_names"

- name: Verify bootstrap Quantum Platform Slurm account association
  ansible.builtin.command:
    cmd: >-
      sacctmgr -nP show association
      where cluster={{ slurm_cluster_name }}
      account={{ jupyterhub_execution_slurm_account }}
      format=Cluster,Account
  register: quantum_platform_slurm_account_assoc
  changed_when: false
  failed_when: >-
    (slurm_cluster_name ~ '|' ~ jupyterhub_execution_slurm_account)
    not in quantum_platform_slurm_account_assoc.stdout
  when: "'slurm_controller' in group_names"

- name: Check research Slurm associations
  ansible.builtin.command:
    cmd: >-
      sacctmgr -nP show association
      where cluster={{ slurm_cluster_name }}
      account={{ jupyterhub_execution_slurm_account }}
      user={{ item.name }}
      format=User
  register: research_slurm_associations
  changed_when: false
  loop: "{{ research_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - "'slurm_controller' in group_names"
    - item.execution_enabled | default(false) | bool

- name: Add explicitly entitled users to bootstrap Slurm account
  ansible.builtin.command:
    cmd: >-
      sacctmgr -i add user {{ item.item.name }}
      account={{ jupyterhub_execution_slurm_account }}
      cluster={{ slurm_cluster_name }}
  loop: "{{ research_slurm_associations.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default('unknown') }}"
  when:
    - item.skipped is not defined
    - item.stdout | trim | length == 0
