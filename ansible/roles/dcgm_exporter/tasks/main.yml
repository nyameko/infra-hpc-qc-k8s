---
- name: Install DCGM Exporter systemd service
  ansible.builtin.template:
    src: dcgm-exporter.service.j2
    dest: /etc/systemd/system/dcgm-exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: restart dcgm exporter

- name: Enable DCGM Exporter
  ansible.builtin.systemd:
    name: dcgm-exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Verify DCGM Exporter metrics
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dcgm_exporter_port }}/metrics"
    status_code: 200
    return_content: false
  register: dcgm_probe
  retries: 20
  delay: 3
  until: dcgm_probe.status == 200
