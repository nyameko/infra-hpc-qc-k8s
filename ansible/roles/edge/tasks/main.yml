---
- name: Install edge packages
  ansible.builtin.dnf:
    name:
      - nftables
      - wireguard-tools
      - bind-utils
      - podman
    state: present

- name: Enable nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    reload: true
