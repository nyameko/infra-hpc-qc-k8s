---
- name: Install edge packages
  ansible.builtin.dnf:
    name:
      - nftables
      - wireguard-tools
      - bind-utils
      - podman
    state: present

- name: Enable nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    reload: true

- name: Deploy nftables configuration
  ansible.builtin.template:
    src: edge.nft.j2
    dest: /etc/nftables/edge.nft
    owner: root
    group: root
    mode: "0644"
  notify: Restart nftables

- name: Configure nftables service entrypoint
  ansible.builtin.copy:
    dest: /etc/sysconfig/nftables.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      include "/etc/nftables/edge.nft"
  notify: Restart nftables
