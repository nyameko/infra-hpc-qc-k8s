---
- name: Install edge packages
  ansible.builtin.dnf:
    name:
      - nftables
      - wireguard-tools
      - bind-utils
      - podman
    state: present

- name: Enable nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    reload: true

- name: Validate gated H200 Slurm forwarding policy before rendering nftables
  ansible.builtin.assert:
    that:
      - edge_h200_slurm_peer_ip == '10.61.0.3'
      - edge_h200_slurm_controller_ip == '10.50.0.12'
      - edge_h200_slurm_diagnostic_icmp is boolean
    fail_msg: >-
      Only the reviewed H200 /32 and single controller /32 may be forwarded.
      Recheck the approved private route, Neutron and network security policy.
  when: edge_h200_slurm_forward_enabled | bool

- name: Deploy nftables configuration
  ansible.builtin.template:
    src: edge.nft.j2
    dest: /etc/nftables/edge.nft
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  notify: Restart nftables

- name: Configure nftables service entrypoint
  ansible.builtin.copy:
    dest: /etc/sysconfig/nftables.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      include "/etc/nftables/edge.nft"
  notify: Restart nftables
