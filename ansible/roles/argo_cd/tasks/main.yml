---
- name: Validate Argo CD bootstrap prerequisites
  ansible.builtin.assert:
    that:
      - argocd_kubeconfig | length > 0
      - argocd_version | length > 0
      - argocd_manifest_url | length > 0
    fail_msg: >-
      Argo CD bootstrap variables are incomplete.

- name: Verify administrator kubeconfig exists
  ansible.builtin.stat:
    path: "{{ argocd_kubeconfig }}"
  register: argocd_kubeconfig_stat

- name: Assert administrator kubeconfig is available
  ansible.builtin.assert:
    that:
      - argocd_kubeconfig_stat.stat.exists
      - argocd_kubeconfig_stat.stat.isreg
      - argocd_kubeconfig_stat.stat.readable
    fail_msg: >-
      {{ argocd_kubeconfig }} is not available to the Ansible execution user.
      The kube_control_plane role should create the administrator kubeconfig first.

- name: Verify kubectl is available
  ansible.builtin.command:
    cmd: "{{ argocd_kubectl_binary }} version --client=true --output=yaml"
  changed_when: false
  environment:
    KUBECONFIG: "{{ argocd_kubeconfig }}"

- name: Verify Kubernetes API access
  ansible.builtin.command:
    cmd: >-
      {{ argocd_kubectl_binary }}
      --kubeconfig {{ argocd_kubeconfig | quote }}
      get --raw=/readyz
  changed_when: false

- name: Create Argo CD namespace
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      {{ argocd_kubectl_binary }}
      --kubeconfig {{ argocd_kubeconfig | quote }}
      create namespace {{ argocd_namespace }}
      --dry-run=client -o yaml |
      {{ argocd_kubectl_binary }}
      --kubeconfig {{ argocd_kubeconfig | quote }}
      apply -f -
  args:
    executable: /bin/bash
  register: argocd_namespace_apply
  changed_when: >-
    'created' in argocd_namespace_apply.stdout or
    'configured' in argocd_namespace_apply.stdout

- name: Install Argo CD
  ansible.builtin.command:
    cmd: >-
      {{ argocd_kubectl_binary }}
      --kubeconfig {{ argocd_kubeconfig | quote }}
      apply
      --namespace {{ argocd_namespace }}
      --server-side
      --force-conflicts
      -f {{ argocd_manifest_url | quote }}
  register: argocd_install
  changed_when: >-
    ('created' in argocd_install.stdout) or
    ('configured' in argocd_install.stdout) or
    ('serverside-applied' in argocd_install.stdout)

- name: Wait for Argo CD server deployment
  ansible.builtin.command:
    cmd: >-
      {{ argocd_kubectl_binary }}
      --kubeconfig {{ argocd_kubeconfig | quote }}
      --namespace {{ argocd_namespace }}
      rollout status deployment/argocd-server --timeout=10m
  changed_when: false

- name: Wait for Argo CD application controller deployment
  ansible.builtin.command:
    cmd: >-
      {{ argocd_kubectl_binary }}
      --kubeconfig {{ argocd_kubeconfig | quote }}
      --namespace {{ argocd_namespace }}
      rollout status statefulset/argocd-application-controller --timeout=10m
  changed_when: false

- name: Verify local SOPS age private key exists
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: "{{ argocd_sops_age_key_file }}"
  register: argocd_sops_age_key_stat

- name: Assert local SOPS age private key exists
  delegate_to: localhost
  become: false
  ansible.builtin.assert:
    that:
      - argocd_sops_age_key_stat.stat.exists
      - argocd_sops_age_key_stat.stat.isreg
      - argocd_sops_age_key_stat.stat.size > 0
    fail_msg: >-
      SOPS age private key was not found at
      {{ argocd_sops_age_key_file }}.

- name: Stage SOPS age private key on control-plane host
  ansible.builtin.copy:
    src: "{{ argocd_sops_age_key_file }}"
    dest: /tmp/argocd-sops-age-keys.txt
    owner: "{{ admin_user_name }}"
    mode: "0600"
  no_log: true

- name: Bootstrap SOPS age key Secret
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      {{ argocd_kubectl_binary }}
      --kubeconfig {{ argocd_kubeconfig | quote }}
      -n {{ argocd_namespace }}
      create secret generic {{ argocd_sops_age_secret_name }}
      --from-file=keys.txt=/tmp/argocd-sops-age-keys.txt
      --dry-run=client
      -o yaml |
      {{ argocd_kubectl_binary }}
      --kubeconfig {{ argocd_kubeconfig | quote }}
      apply -f -
    executable: /bin/bash
  register: argocd_sops_secret
  changed_when: >-
    'created' in argocd_sops_secret.stdout or
    'configured' in argocd_sops_secret.stdout
  no_log: true

- name: Remove staged SOPS age private key
  ansible.builtin.file:
    path: /tmp/argocd-sops-age-keys.txt
    state: absent
  no_log: true

- name: Install KSOPS Kustomize build options
  ansible.builtin.copy:
    src: argocd-cm-ksops-patch.yaml
    dest: /tmp/argocd-cm-ksops-patch.yaml
    mode: "0600"

- name: Configure Argo CD for KSOPS
  ansible.builtin.command:
    cmd: >-
      {{ argocd_kubectl_binary }}
      --kubeconfig {{ argocd_kubeconfig | quote }}
      patch configmap argocd-cm
      -n {{ argocd_namespace }}
      --type merge
      --patch-file /tmp/argocd-cm-ksops-patch.yaml
  register: argocd_cm_ksops_patch
  changed_when: "'configured' in argocd_cm_ksops_patch.stdout"

- name: Remove Argo CD ConfigMap patch
  ansible.builtin.file:
    path: /tmp/argocd-cm-ksops-patch.yaml
    state: absent

- name: Stage Argo CD repo-server KSOPS patch
  ansible.builtin.copy:
    src: argocd-repo-server-ksops-patch.yaml
    dest: /tmp/argocd-repo-server-ksops-patch.yaml
    mode: "0600"

- name: Configure Argo CD repo-server with KSOPS
  ansible.builtin.command:
    cmd: >-
      {{ argocd_kubectl_binary }}
      --kubeconfig {{ argocd_kubeconfig | quote }}
      patch deployment argocd-repo-server
      -n {{ argocd_namespace }}
      --type strategic
      --patch-file /tmp/argocd-repo-server-ksops-patch.yaml
  register: argocd_repo_server_patch
  changed_when: "'patched' in argocd_repo_server_patch.stdout"

- name: Remove repo-server patch
  ansible.builtin.file:
    path: /tmp/argocd-repo-server-ksops-patch.yaml
    state: absent

- name: Wait for Argo CD repo-server
  ansible.builtin.command:
    cmd: >-
      {{ argocd_kubectl_binary }}
      --kubeconfig {{ argocd_kubeconfig | quote }}
      -n {{ argocd_namespace }}
      rollout status deployment/argocd-repo-server --timeout=10m
  changed_when: false

- name: Verify Argo CD pods are ready
  ansible.builtin.command:
    cmd: >-
      {{ argocd_kubectl_binary }}
      --kubeconfig {{ argocd_kubeconfig | quote }}
      --namespace {{ argocd_namespace }}
      get pods
  register: argocd_pods
  changed_when: false

- name: Show Argo CD pod status
  ansible.builtin.debug:
    var: argocd_pods.stdout_lines
