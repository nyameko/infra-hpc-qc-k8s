---
- name: Find this node's declared Slurm resources
  ansible.builtin.set_fact:
    slurm_this_node: "{{ slurm_nodes | selectattr('name', 'equalto', inventory_hostname) | first }}"

- name: Verify expected virtual CPU count before joining scheduler
  ansible.builtin.assert:
    that:
      - ansible_facts["processor_vcpus"] | int == slurm_this_node.cpus | int
    fail_msg: "The OpenStack flavor does not match the Slurm node CPU declaration."

- name: Verify configured Slurm memory does not exceed detected node memory
  ansible.builtin.command: slurmd -C
  register: slurmd_discovery
  changed_when: false

- name: Record Slurm-detected compute memory
  ansible.builtin.set_fact:
    slurm_detected_real_memory_mb: >-
      {{
        (slurmd_discovery.stdout
        | regex_findall('RealMemory=([0-9]+)')
        | first)
        | int
      }}

- name: Require configured allocatable memory to fit detected memory
  ansible.builtin.assert:
    that:
      - slurm_this_node.real_memory_mb | int <= slurm_detected_real_memory_mb | int
    fail_msg: >-
      Configured Slurm RealMemory exceeds slurmd -C detected memory;
      lower real_memory_mb for this node.

- name: Create Slurm compute directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /var/spool/slurmd, owner: root, group: root, mode: "0755"}
    - {path: /var/log/slurm, owner: slurm, group: slurm, mode: "0755"}

- name: Install cgroup enforcement policy
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../roles/slurm_common/templates/cgroup.conf.j2"
    dest: /etc/slurm/cgroup.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart slurmd

- name: Require discovered CPU count to agree with configuration
  ansible.builtin.assert:
    that:
      - "('CPUs=' ~ slurm_this_node.cpus) in slurmd_discovery.stdout"
    fail_msg: "Inspect slurmd -C output before enabling compute daemon."

- name: Start compute daemon
  ansible.builtin.systemd:
    name: slurmd
    enabled: true
    state: "{{ 'restarted' if (slurm_common_config is defined and slurm_common_config.changed) else 'started' }}"
