---
- name: Ensure sshd is enabled
  ansible.builtin.systemd:
    name: sshd
    enabled: true
    state: started

- name: Disable password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
  notify: restart sshd
