---
- name: Create WireGuard directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Install example WireGuard configuration
  ansible.builtin.copy:
    dest: /etc/wireguard/wg0.conf.example
    mode: '0600'
    content: |
      [Interface]
      Address = 10.60.0.1/24
      ListenPort = 51820
      # Real private key and peers go into Ansible Vault/SOPS.
