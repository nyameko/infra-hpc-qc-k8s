---
- name: Require explicit model-cache block device
  ansible.builtin.assert:
    that:
      - nvidia_gpu_host_model_cache_device | length > 0
      - nvidia_gpu_host_model_cache_device != "/dev/vda"
      - nvidia_gpu_host_model_cache_device != "/dev/vdb"
    fail_msg: >-
      Set nvidia_gpu_host_model_cache_device explicitly after verifying lsblk.
      Never point the role at the root disk or config-drive device.

- name: Install GPU host prerequisites
  ansible.builtin.dnf:
    name:
      - dnf-plugins-core
      - kernel-devel-matched
      - kernel-headers
      - pciutils
      - podman
      - xfsprogs
    state: present

- name: Configure NVIDIA CUDA repository
  ansible.builtin.get_url:
    url: "{{ nvidia_gpu_host_cuda_repo_url }}"
    dest: /etc/yum.repos.d/cuda-rhel9.repo
    owner: root
    group: root
    mode: "0644"

- name: Enable NVIDIA open-DKMS module stream
  when: nvidia_gpu_host_install_driver | bool
  ansible.builtin.command:
    cmd: "dnf -y module enable nvidia-driver:{{ nvidia_gpu_host_driver_module_stream }}"
  register: nvidia_gpu_host_module_enable
  changed_when: "'Nothing to do' not in nvidia_gpu_host_module_enable.stdout"

- name: Install NVIDIA headless compute driver
  when: nvidia_gpu_host_install_driver | bool
  ansible.builtin.dnf:
    name:
      - nvidia-driver-cuda
      - kmod-nvidia-open-dkms
    state: present
  register: nvidia_gpu_host_driver_packages

- name: Install NVIDIA Container Toolkit repository file
  when: nvidia_gpu_host_install_container_toolkit | bool
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo
    dest: /etc/yum.repos.d/nvidia-container-toolkit.repo
    owner: root
    group: root
    mode: "0644"

- name: Install NVIDIA Container Toolkit
  when: nvidia_gpu_host_install_container_toolkit | bool
  ansible.builtin.dnf:
    name: nvidia-container-toolkit
    state: present

- name: Reboot after NVIDIA driver installation
  when:
    - nvidia_gpu_host_reboot_after_driver_install | bool
    - nvidia_gpu_host_driver_packages is changed
  ansible.builtin.reboot:
    reboot_timeout: 900

- name: Detect installed NVIDIA DKMS module version
  ansible.builtin.shell: |
    set -o pipefail
    rpm -q --qf '%{VERSION}\\n' kmod-nvidia-open-dkms | head -1
  args:
    executable: /bin/bash
  register: nvidia_gpu_host_driver_version
  changed_when: false
  when: nvidia_gpu_host_install_driver | bool

- name: Check NVIDIA kernel module for running kernel
  ansible.builtin.command:
    cmd: modinfo nvidia
  register: nvidia_gpu_host_modinfo
  changed_when: false
  failed_when: false
  when: nvidia_gpu_host_install_driver | bool

- name: Build NVIDIA DKMS module for running kernel if missing
  ansible.builtin.command:
    cmd: "dkms build -m nvidia -v {{ nvidia_gpu_host_driver_version.stdout }} -k {{ ansible_facts.kernel }}"
  when:
    - nvidia_gpu_host_install_driver | bool
    - nvidia_gpu_host_modinfo.rc != 0

- name: Install NVIDIA DKMS module for running kernel if missing
  ansible.builtin.command:
    cmd: "dkms install -m nvidia -v {{ nvidia_gpu_host_driver_version.stdout }} -k {{ ansible_facts.kernel }}"
  when:
    - nvidia_gpu_host_install_driver | bool
    - nvidia_gpu_host_modinfo.rc != 0

- name: Refresh running kernel module dependencies after DKMS installation
  ansible.builtin.command:
    cmd: "depmod -a {{ ansible_facts.kernel }}"
  when:
    - nvidia_gpu_host_install_driver | bool
    - nvidia_gpu_host_modinfo.rc != 0

- name: Load NVIDIA kernel module
  ansible.builtin.command:
    cmd: modprobe nvidia
  changed_when: false

- name: Verify NVIDIA GPU
  ansible.builtin.command:
    cmd: nvidia-smi
  changed_when: false

- name: Create CDI directory
  ansible.builtin.file:
    path: /etc/cdi
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generate NVIDIA CDI specification
  ansible.builtin.command:
    cmd: nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
  changed_when: true

- name: Wait for model cache block device
  ansible.builtin.wait_for:
    path: "{{ nvidia_gpu_host_model_cache_device }}"
    timeout: 60

- name: Create model cache filesystem if absent
  community.general.filesystem:
    fstype: "{{ nvidia_gpu_host_model_cache_fstype }}"
    dev: "{{ nvidia_gpu_host_model_cache_device }}"

- name: Create model cache mountpoint
  ansible.builtin.file:
    path: "{{ nvidia_gpu_host_model_cache_mount }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Mount model cache volume
  ansible.posix.mount:
    path: "{{ nvidia_gpu_host_model_cache_mount }}"
    src: "{{ nvidia_gpu_host_model_cache_device }}"
    fstype: "{{ nvidia_gpu_host_model_cache_fstype }}"
    opts: defaults,noatime
    state: mounted
