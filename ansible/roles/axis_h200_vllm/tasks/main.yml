---
- name: Explain vLLM deployment guard
  ansible.builtin.debug:
    msg: >-
      H200 vLLM deployment is disabled by default. Set
      axis_h200_vllm_manage=true to stage a GPU-pinned loopback-only
      Quadlet and axis_h200_vllm_start=true to start it, after testing
      the disposable h200-vllm-test container and recording its image digest.
  when: not (axis_h200_vllm_manage | bool)

- name: Stage approved private inference service
  when: axis_h200_vllm_manage | bool
  block:
    - name: Require immutable image and approved inference GPU
      ansible.builtin.assert:
        that:
          - axis_h200_vllm_image is match('^docker\\.io/vllm/vllm-openai@sha256:[0-9a-f]{64}$')
          - axis_h200_vllm_gpu_uuid in axis_h200_expected_gpu_uuids[0:4]
          - axis_h200_vllm_model_cache == '/srv/h200/inference/models'
          - axis_h200_vllm_env_file == '/etc/vllm/h200.env'
          - axis_h200_vllm_port | int == 8000
          - axis_h200_vllm_start is boolean
        fail_msg: "Pin an approved OCI sha256 image digest and a GPU among indices 0-3; loopback endpoint is mandatory."

    - name: Confirm model-cache mount is a real XFS mount
      ansible.builtin.command:
        argv: [findmnt, -n, -o, FSTYPE, --mountpoint, "{{ axis_h200_vllm_model_cache }}"]
      register: axis_h200_vllm_mount
      changed_when: false
      failed_when: axis_h200_vllm_mount.rc != 0 or (axis_h200_vllm_mount.stdout | trim) != 'xfs'

    - name: Confirm the existing protected API key file exists
      ansible.builtin.stat:
        path: "{{ axis_h200_vllm_env_file }}"
      register: axis_h200_vllm_env_stat

    - name: Reject missing or permissive API credentials
      ansible.builtin.assert:
        that:
          - axis_h200_vllm_env_stat.stat.isreg | default(false)
          - axis_h200_vllm_env_stat.stat.pw_name == 'root'
          - axis_h200_vllm_env_stat.stat.mode == '0600'
        fail_msg: "Expected existing /etc/vllm/h200.env owned by root mode 0600. Do not commit or print its token."

    - name: Verify API-key declaration without logging its value
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import pathlib,sys;
            p=pathlib.Path('/etc/vllm/h200.env');
            lines=p.read_text().splitlines();
            sys.exit(0 if len(lines)==1 and lines[0].startswith('VLLM_API_KEY=') and len(lines[0].split('=',1)[1])>=32 else 1)
      changed_when: false
      no_log: true

    - name: Require already present image to prevent unexpected pulls
      ansible.builtin.command:
        argv: [podman, image, exists, "{{ axis_h200_vllm_image }}"]
      register: axis_h200_vllm_image_present
      changed_when: false
      failed_when: axis_h200_vllm_image_present.rc != 0

    - name: Require GPU UUID to be exported by NVIDIA CDI
      ansible.builtin.command:
        argv: [nvidia-ctk, cdi, list]
      register: axis_h200_vllm_cdi
      changed_when: false
      failed_when: "('nvidia.com/gpu=' ~ axis_h200_vllm_gpu_uuid) not in axis_h200_vllm_cdi.stdout"

    - name: Create unprivileged container model-cache subdirectory
      ansible.builtin.file:
        path: "{{ axis_h200_vllm_hf_cache }}"
        state: directory
        owner: "2000"
        group: "0"
        mode: "0770"

    - name: Ensure Quadlet directory exists
      ansible.builtin.file:
        path: /etc/containers/systemd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Stage rootful Podman Quadlet (host loopback only)
      ansible.builtin.template:
        src: h200-vllm.container.j2
        dest: /etc/containers/systemd/h200-vllm.container
        owner: root
        group: root
        mode: "0644"
      register: axis_h200_vllm_quadlet

    - name: Regenerate systemd units from Quadlet
      ansible.builtin.systemd:
        daemon_reload: true
      when: axis_h200_vllm_quadlet.changed

    - name: Start only after operator has stopped h200-vllm-test
      ansible.builtin.systemd:
        name: h200-vllm.service
        state: started
      when: axis_h200_vllm_start | bool

    - name: Report staged inference service
      ansible.builtin.debug:
        msg:
          - "Quadlet staged on loopback only: 127.0.0.1:8000"
          - "Systemd service start requested: {{ axis_h200_vllm_start | bool }}"
          - "Manual test container h200-vllm-test must be stopped before managed start."
          - "No public or WireGuard host port has been opened."
