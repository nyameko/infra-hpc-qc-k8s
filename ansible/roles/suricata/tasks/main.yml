---
- name: Install EPEL repository
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: Install DNF plugins
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Enable CRB repository
  ansible.builtin.command:
    cmd: dnf config-manager --set-enabled crb
  changed_when: false

- name: Inspect previously installed Suricata version
  ansible.builtin.command:
    cmd: rpm -q --qf '%{VERSION}' suricata
  register: suricata_previous_version
  changed_when: false
  failed_when: false

- name: Stop Suricata only for a 7.x to 8.x upgrade
  ansible.builtin.systemd:
    name: suricata
    state: stopped
  when:
    - suricata_previous_version.rc == 0
    - suricata_previous_version.stdout is match('^7[.]')

- name: Disable obsolete Suricata 7 COPR
  ansible.builtin.command:
    cmd: "dnf -y copr disable {{ suricata_old_copr_repo }}"
  changed_when: false
  failed_when: false

- name: Enable Suricata 8 COPR
  ansible.builtin.command:
    cmd: "dnf -y copr enable {{ suricata_copr_repo }}"
  changed_when: false

- name: Install latest supported Suricata 8 package
  ansible.builtin.dnf:
    name: suricata
    state: latest
    update_cache: true

- name: Read installed Suricata version
  ansible.builtin.command:
    cmd: suricata -V
  register: suricata_version
  changed_when: false

- name: Require Suricata 8.0
  ansible.builtin.assert:
    that:
      - "suricata_version.stdout is search('Suricata version 8[.]0[.]')"
    fail_msg: >-
      Expected a Suricata 8.0.x package from the OISF 8.0 COPR.
      Installed version was: {{ suricata_version.stdout }}

- name: Ensure Suricata log directory is writable by Suricata
  ansible.builtin.file:
    path: /var/log/suricata
    state: directory
    owner: suricata
    group: suricata
    mode: "0750"
  notify: Restart Suricata

- name: Inspect existing Suricata output files
  ansible.builtin.stat:
    path: "/var/log/suricata/{{ item }}"
  loop:
    - eve.json
    - stats.log
  register: suricata_output_files

- name: Repair ownership of existing Suricata output files
  ansible.builtin.file:
    path: "/var/log/suricata/{{ item.item }}"
    state: file
    owner: suricata
    group: suricata
    mode: "0640"
  loop: "{{ suricata_output_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists
  notify: Restart Suricata

- name: Ensure local Suricata rules directory exists
  ansible.builtin.file:
    path: /etc/suricata/rules
    state: directory
    owner: root
    group: suricata
    mode: "0750"

- name: Deploy infra-hpc-qc-k8s Suricata configuration
  ansible.builtin.template:
    src: infra-hpc-qc-k8s.yaml.j2
    dest: "{{ suricata_config_override }}"
    owner: root
    group: suricata
    mode: "0640"
  notify: Restart Suricata

- name: Deploy controlled Suricata local rules
  ansible.builtin.template:
    src: local.rules.j2
    dest: "{{ suricata_local_rules }}"
    owner: root
    group: suricata
    mode: "0640"
  notify: Restart Suricata

- name: Configure Suricata service options
  ansible.builtin.template:
    src: suricata.sysconfig.j2
    dest: /etc/sysconfig/suricata
    owner: root
    group: root
    mode: "0644"
  notify: Restart Suricata

- name: Check for existing ET Open ruleset
  ansible.builtin.stat:
    path: /var/lib/suricata/rules/suricata.rules
  register: suricata_ruleset

- name: Download initial ET Open ruleset
  ansible.builtin.command:
    cmd: suricata-update
  when: not suricata_ruleset.stat.exists
  notify: Restart Suricata

- name: Allow Wazuh to read Suricata logs
  ansible.builtin.user:
    name: wazuh
    groups: suricata
    append: true
  when: suricata_wazuh_integration_enabled | bool
  notify: Restart Wazuh manager

- name: Configure Wazuh to ingest Suricata EVE JSON
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    insertbefore: '^</ossec_config>'
    marker: '  <!-- {mark} ANSIBLE MANAGED SURICATA EVE -->'
    block: |2
        <localfile>
          <log_format>json</log_format>
          <location>{{ suricata_eve_log }}</location>
        </localfile>
  when: suricata_wazuh_integration_enabled | bool
  notify: Restart Wazuh manager

- name: Validate Wazuh logcollector configuration
  ansible.builtin.command:
    cmd: /var/ossec/bin/wazuh-logcollector -t
  when: suricata_wazuh_integration_enabled | bool
  changed_when: false

- name: Validate Suricata configuration and rules
  ansible.builtin.command:
    argv:
      - suricata
      - -T
      - -c
      - /etc/suricata/suricata.yaml
      - --include
      - "{{ suricata_config_override }}"
      - --set
      - "vars.address-groups.HOME_NET={{ suricata_home_net }}"
  changed_when: false

- name: Enable and start Suricata
  ansible.builtin.systemd:
    name: suricata
    enabled: true
    state: started
