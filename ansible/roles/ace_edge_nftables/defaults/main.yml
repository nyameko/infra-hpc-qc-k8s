ace_nft_wg_port: 51821
ace_nft_admin_ssh_cidrs: []
ace_nft_wireguard_peer_public_cidrs: []
ace_nft_local_cidr: ""
ace_nft_remote_cidrs: []
ace_nft_peer_tunnel_cidr: ""
ace_nft_metrics_cidrs: []
