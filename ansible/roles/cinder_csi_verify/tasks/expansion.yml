---
- name: Expand SSD validation PVC
  kubernetes.core.k8s:
    kubeconfig: "{{ cinder_csi_kubeconfig }}"
    api_version: v1
    kind: PersistentVolumeClaim
    name: cinder-ssd-pvc
    namespace: "{{ cinder_csi_validation_namespace }}"
    state: present
    definition:
      spec:
        resources:
          requests:
            storage: "{{ cinder_csi_validation_expanded_size }}"

- name: Wait for SSD PVC capacity expansion
  kubernetes.core.k8s_info:
    kubeconfig: "{{ cinder_csi_kubeconfig }}"
    api_version: v1
    kind: PersistentVolumeClaim
    name: cinder-ssd-pvc
    namespace: "{{ cinder_csi_validation_namespace }}"
  register: cinder_csi_ssd_pvc
  until:
    - cinder_csi_ssd_pvc.resources | length == 1
    - >
      cinder_csi_ssd_pvc.resources[0].status.capacity.storage |
      default('') ==
      cinder_csi_validation_expanded_size
  retries: 60
  delay: 10

- name: Verify SSD PVC expansion
  ansible.builtin.assert:
    that:
      - cinder_csi_ssd_pvc.resources[0].status.capacity.storage ==
        cinder_csi_validation_expanded_size
    fail_msg: >-
      SSD PVC did not expand to
      {{ cinder_csi_validation_expanded_size }}.
