- name: Apply validation workload
  kubernetes.core.k8s:
    kubeconfig: "{{ cinder_csi_kubeconfig }}"
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cinder-csi-validation
        namespace: "{{ cinder_csi_validation_namespace }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: cinder-csi-validation
        template:
          metadata:
            labels:
              app: cinder-csi-validation
          spec:
            containers:
              - name: validator
                image: busybox:1.36
                command:
                  - sh
                  - -c
                  - "sleep 3600"
                volumeMounts:
                  - name: ssd
                    mountPath: /data/ssd
                  - name: hdd
                    mountPath: /data/hdd
                  - name: default
                    mountPath: /data/default
            volumes:
              - name: ssd
                persistentVolumeClaim:
                  claimName: cinder-ssd-pvc
              - name: hdd
                persistentVolumeClaim:
                  claimName: cinder-hdd-pvc
              - name: default
                persistentVolumeClaim:
                  claimName: cinder-default-pvc
