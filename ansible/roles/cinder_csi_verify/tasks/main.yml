---
- name: Verify Cinder CSI driver
  ansible.builtin.include_tasks:
    file: driver.yml

- name: Deploy Cinder CSI validation workload
  ansible.builtin.include_tasks:
    file: workload.yml

- name: Verify Cinder CSI persistence
  ansible.builtin.include_tasks:
    file: persistence.yml

- name: Verify Cinder CSI volume expansion
  ansible.builtin.include_tasks:
    file: expansion.yml

- name: Clean up Cinder CSI validation resources
  ansible.builtin.include_tasks:
    file: cleanup.yml
  when: cinder_csi_validation_cleanup
