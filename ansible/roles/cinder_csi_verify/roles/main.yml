---
- name: Wait for Cinder CSI controller deployment
  ansible.builtin.command:
    cmd: >-
      {{ cinder_csi_kubectl_binary }}
      --kubeconfig {{ cinder_csi_kubeconfig | quote }}
      -n {{ cinder_csi_namespace }}
      rollout status
      deployment/{{ cinder_csi_release_name }}-controllerplugin
      --timeout=10m
  changed_when: false
  environment:
    KUBECONFIG: "{{ cinder_csi_kubeconfig }}"

- name: Wait for Cinder CSI node daemonset
  ansible.builtin.command:
    cmd: >-
      {{ cinder_csi_kubectl_binary }}
      --kubeconfig {{ cinder_csi_kubeconfig | quote }}
      -n {{ cinder_csi_namespace }}
      rollout status
      daemonset/{{ cinder_csi_release_name }}-nodeplugin
      --timeout=10m
  changed_when: false
  environment:
    KUBECONFIG: "{{ cinder_csi_kubeconfig }}"

- name: Verify CSI driver registration
  ansible.builtin.command:
    cmd: >-
      {{ cinder_csi_kubectl_binary }}
      --kubeconfig {{ cinder_csi_kubeconfig | quote }}
      get csidriver cinder.csi.openstack.org
  changed_when: false
  environment:
    KUBECONFIG: "{{ cinder_csi_kubeconfig }}"

- name: Apply Cinder CSI StorageClasses
  kubernetes.core.k8s:
    kubeconfig: "{{ cinder_csi_kubeconfig }}"
    state: present
    definition: "{{ lookup('template', 'storageclasses.yaml.j2') | from_yaml_all | list }}"

- name: Apply Cinder CSI validation workload
  kubernetes.core.k8s:
    kubeconfig: "{{ cinder_csi_kubeconfig }}"
    state: present
    definition: "{{ lookup('template', 'validation.yaml.j2') | from_yaml_all | list }}"
  when: cinder_csi_validation_enabled

- name: Wait for validation deployment
  ansible.builtin.command:
    cmd: >-
      {{ cinder_csi_kubectl_binary }}
      --kubeconfig {{ cinder_csi_kubeconfig | quote }}
      -n {{ cinder_csi_validation_namespace }}
      rollout status
      deployment/cinder-csi-validation
      --timeout=15m
  changed_when: false
  environment:
    KUBECONFIG: "{{ cinder_csi_kubeconfig }}"
  when: cinder_csi_validation_enabled

- name: Get validation pod name
  ansible.builtin.command:
    cmd: >-
      {{ cinder_csi_kubectl_binary }}
      --kubeconfig {{ cinder_csi_kubeconfig | quote }}
      -n {{ cinder_csi_validation_namespace }}
      get pods
      -l app=cinder-csi-validation
      -o jsonpath='{.items[0].metadata.name}'
  register: cinder_csi_validation_pod
  changed_when: false
  environment:
    KUBECONFIG: "{{ cinder_csi_kubeconfig }}"
  when: cinder_csi_validation_enabled

- name: Write deterministic persistence markers
  ansible.builtin.command:
    cmd: >-
      {{ cinder_csi_kubectl_binary }}
      --kubeconfig {{ cinder_csi_kubeconfig | quote }}
      -n {{ cinder_csi_validation_namespace }}
      exec {{ cinder_csi_validation_pod.stdout | trim }} --
      sh -c
      'printf "cinder-ssd-persistent\n" > /data/ssd/proof.txt;
       printf "cinder-hdd-persistent\n" > /data/hdd/proof.txt;
       printf "cinder-default-persistent\n" > /data/default/proof.txt'
  environment:
    KUBECONFIG: "{{ cinder_csi_kubeconfig }}"
  when: cinder_csi_validation_enabled

- name: Restart validation pod to test persistence
  ansible.builtin.command:
    cmd: >-
      {{ cinder_csi_kubectl_binary }}
      --kubeconfig {{ cinder_csi_kubeconfig | quote }}
      -n {{ cinder_csi_validation_namespace }}
      delete pod {{ cinder_csi_validation_pod.stdout | trim }}
      --wait=true
  environment:
    KUBECONFIG: "{{ cinder_csi_kubeconfig }}"
  when: cinder_csi_validation_enabled

- name: Wait for validation deployment after pod recreation
  ansible.builtin.command:
    cmd: >-
      {{ cinder_csi_kubectl_binary }}
      --kubeconfig {{ cinder_csi_kubeconfig | quote }}
      -n {{ cinder_csi_validation_namespace }}
      rollout status
      deployment/cinder-csi-validation
      --timeout=15m
  changed_when: false
  environment:
    KUBECONFIG: "{{ cinder_csi_kubeconfig }}"
  when: cinder_csi_validation_enabled

- name: Verify persistence markers survived pod recreation
  ansible.builtin.shell: >-
    POD=$(
      {{ cinder_csi_kubectl_binary }}
      --kubeconfig {{ cinder_csi_kubeconfig | quote }}
      -n {{ cinder_csi_validation_namespace }}
      get pods
      -l app=cinder-csi-validation
      -o jsonpath='{.items[0].metadata.name}'
    ) &&
    {{ cinder_csi_kubectl_binary }}
    --kubeconfig {{ cinder_csi_kubeconfig | quote }}
    -n {{ cinder_csi_validation_namespace }}
    exec "$POD" -- sh -c
    'grep -qx "cinder-ssd-persistent" /data/ssd/proof.txt &&
     grep -qx "cinder-hdd-persistent" /data/hdd/proof.txt &&
     grep -qx "cinder-default-persistent" /data/default/proof.txt'
  args:
    executable: /bin/bash
  changed_when: false
  environment:
    KUBECONFIG: "{{ cinder_csi_kubeconfig }}"
  when: cinder_csi_validation_enabled

- name: Expand SSD validation PVC
  ansible.builtin.command:
    cmd: >-
      {{ cinder_csi_kubectl_binary }}
      --kubeconfig {{ cinder_csi_kubeconfig | quote }}
      -n {{ cinder_csi_validation_namespace }}
      patch pvc cinder-ssd-pvc
      --type merge
      -p
      '{"spec":{"resources":{"requests":{"storage":"{{ cinder_csi_validation_expanded_size }}"}}}}'
  environment:
    KUBECONFIG: "{{ cinder_csi_kubeconfig }}"
  when: cinder_csi_validation_enabled

- name: Wait for SSD PVC expansion
  ansible.builtin.shell: >-
    {{ cinder_csi_kubectl_binary }}
    --kubeconfig {{ cinder_csi_kubeconfig | quote }}
    -n {{ cinder_csi_validation_namespace }}
    get pvc cinder-ssd-pvc
    -o jsonpath='{.status.capacity.storage}'
  args:
    executable: /bin/bash
  register: cinder_csi_expanded_size
  until: cinder_csi_expanded_size.stdout | trim == cinder_csi_validation_expanded_size
  retries: 30
  delay: 10
  changed_when: false
  environment:
    KUBECONFIG: "{{ cinder_csi_kubeconfig }}"
  when: cinder_csi_validation_enabled

- name: Show final Cinder CSI validation state
  ansible.builtin.command:
    cmd: >-
      {{ cinder_csi_kubectl_binary }}
      --kubeconfig {{ cinder_csi_kubeconfig | quote }}
      -n {{ cinder_csi_validation_namespace }}
      get pvc,pv,pods -o wide
  changed_when: false
  environment:
    KUBECONFIG: "{{ cinder_csi_kubeconfig }}"
  when: cinder_csi_validation_enabled
