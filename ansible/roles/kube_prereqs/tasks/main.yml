---
- name: Install Kubernetes prerequisites
  ansible.builtin.dnf:
    name:
      - ca-certificates
      - curl
      - conntrack
      - socat
      - ebtables
      - ethtool
      - iproute-tc
    state: present
    update_cache: true

- name: Configure Kubernetes repository
  ansible.builtin.template:
    src: kubernetes.repo.j2
    dest: /etc/yum.repos.d/kubernetes.repo
    owner: root
    group: root
    mode: "0644"

- name: Configure kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      overlay
      br_netfilter

- name: Load overlay
  community.general.modprobe:
    name: overlay
    state: present

- name: Load br_netfilter
  community.general.modprobe:
    name: br_netfilter
    state: present

- name: Configure Kubernetes sysctl
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    mode: '0644'
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Configure Kubernetes package repository
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/kubernetes.repo
    mode: '0644'
    content: |
      [kubernetes]
      name=Kubernetes
      baseurl=https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor }}/rpm/
      enabled=1
      gpgcheck=1
      gpgkey=https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor }}/rpm/repodata/repomd.xml.key
      exclude=kubelet kubeadm kubectl cri-tools kubernetes-cni

- name: Install Kubernetes packages
  ansible.builtin.dnf:
    name:
      - kubelet
      - kubeadm
      - kubectl
      - cri_tools
    state: present
    disable_excludes: kubernetes

- name: Enable kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
