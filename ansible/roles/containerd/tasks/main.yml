---
- name: Install Docker repository dependencies
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Configure Docker repository
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/centos/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    owner: root
    group: root
    mode: "0644"

- name: Install containerd
  ansible.builtin.dnf:
    name: containerd.io
    state: present
    update_cache: true

- name: Create containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generate containerd configuration
  ansible.builtin.command:
    cmd: containerd config default
  register: containerd_config
  changed_when: false

- name: Configure containerd
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
    content: "{{ containerd_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}\n"
  notify: restart containerd

- name: Enable containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

- name: Verify containerd
  ansible.builtin.command:
    cmd: containerd --version
  changed_when: false

- name: Verify containerd service
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true
