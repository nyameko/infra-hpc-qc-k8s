---
- name: Install containerd
  ansible.builtin.dnf:
    name: containerd
    state: present

- name: Create default containerd configuration
  ansible.builtin.command: containerd config default
  register: containerd_default
  changed_when: false

- name: Configure containerd for systemd cgroups
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    content: "{{ containerd_default.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}\n"
    mode: '0644'
  notify: restart containerd
