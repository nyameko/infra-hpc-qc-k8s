---
node_exporter_version: "1.12.1"
node_exporter_arch: amd64

node_exporter_install_dir: /usr/local/bin
node_exporter_user: node_exporter
node_exporter_group: node_exporter
node_exporter_service: node_exporter

node_exporter_listen_address: "0.0.0.0"
node_exporter_port: 9100
node_exporter_metrics_path: /metrics

node_exporter_probe_address: "127.0.0.1"

node_exporter_archive: >-
  node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz

node_exporter_download_url: >-
  https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/{{ node_exporter_archive }}

node_exporter_checksum: >-
  sha256:b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
