---
- name: Install Python virtualenv prerequisites
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
    state: present

- name: Create JupyterHub single-user virtual environment
  ansible.builtin.command:
    cmd: "python3 -m venv {{ jupyterhub_singleuser_venv }}"
    creates: "{{ jupyterhub_singleuser_venv }}/bin/python"

- name: Install pinned single-user runtime
  ansible.builtin.pip:
    name: "{{ jupyterhub_singleuser_packages }}"
    virtualenv: "{{ jupyterhub_singleuser_venv }}"

- name: Ensure JupyterHub entitlement group exists
  ansible.builtin.group:
    name: "{{ jupyterhub_allowed_group }}"
    state: present

- name: Create disposable smoke-test identity when explicitly enabled
  when: jupyterhub_smoke_user_enabled | bool
  block:
    - name: Create smoke-test primary group
      ansible.builtin.group:
        name: "{{ jupyterhub_smoke_user }}"
        gid: "{{ jupyterhub_smoke_gid }}"
        state: present

    - name: Create smoke-test user without local home creation
      ansible.builtin.user:
        name: "{{ jupyterhub_smoke_user }}"
        uid: "{{ jupyterhub_smoke_uid }}"
        group: "{{ jupyterhub_smoke_user }}"
        groups:
          - "{{ jupyterhub_allowed_group }}"
        append: true
        home: "/home/research/{{ jupyterhub_smoke_user }}"
        create_home: false
        shell: /bin/bash
        state: present
