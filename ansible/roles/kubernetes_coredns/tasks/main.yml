---
- name: Validate private CoreDNS zones
  ansible.builtin.assert:
    that:
      - item.zone is defined
      - item.zone | string | length > 0
      - item.forwarders is defined
      - item.forwarders | length > 0
    fail_msg: >-
      Each kubernetes_coredns_private_zones item requires a non-empty zone and
      at least one forwarder.
  loop: "{{ kubernetes_coredns_private_zones }}"
  loop_control:
    label: "{{ item.zone | default('undefined') }}"

- name: Render managed CoreDNS ConfigMap
  ansible.builtin.template:
    src: Corefile.yaml.j2
    dest: "{{ kubernetes_coredns_manifest_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Compare managed CoreDNS configuration with the cluster
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_coredns_kubeconfig }}"
      - diff
      - -f
      - "{{ kubernetes_coredns_manifest_path }}"
  register: kubernetes_coredns_diff
  changed_when: kubernetes_coredns_diff.rc == 1
  failed_when: kubernetes_coredns_diff.rc not in [0, 1]

- name: Apply managed CoreDNS configuration
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_coredns_kubeconfig }}"
      - apply
      - -f
      - "{{ kubernetes_coredns_manifest_path }}"
  register: kubernetes_coredns_apply
  changed_when: >-
    'configured' in kubernetes_coredns_apply.stdout
    or 'created' in kubernetes_coredns_apply.stdout
  when: kubernetes_coredns_diff.rc == 1

- name: Restart CoreDNS after managed configuration change
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_coredns_kubeconfig }}"
      - -n
      - kube-system
      - rollout
      - restart
      - deployment/coredns
  when: kubernetes_coredns_diff.rc == 1
  changed_when: true

- name: Wait for CoreDNS rollout
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ kubernetes_coredns_kubeconfig }}"
      - -n
      - kube-system
      - rollout
      - status
      - deployment/coredns
      - --timeout=120s
  changed_when: false
  when: kubernetes_coredns_diff.rc == 1
