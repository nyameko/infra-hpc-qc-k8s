---
- name: Require explicit pinned Slurm release and private MUNGE credential
  ansible.builtin.assert:
    that:
      - slurm_package_version | length > 0
      - slurm_munge_key_b64 | length > 0
      - slurm_munge_key_b64 | length >= 1368
      - slurm_nodes | length > 0
      - (slurm_nodes | map(attribute='name') | unique | list | length) == (slurm_nodes | length)
    fail_msg: "Set slurm_package_version and vaulted slurm_munge_key_b64; review inventory."
  no_log: true

- name: Verify host is part of the declared Slurm cluster
  ansible.builtin.assert:
    that:
      - inventory_hostname == slurm_controller_hostname or inventory_hostname in groups['slurm_login'] or inventory_hostname in (slurm_nodes | map(attribute='name') | list)

- name: Install Slurm role packages from vetted artifact set
  ansible.builtin.dnf:
    name: "{{ slurm_role_packages }}"
    state: present
    disable_gpg_check: "{{ slurm_allow_unsigned_rpms | bool }}"

- name: Read installed Slurm RPM metadata
  ansible.builtin.package_facts:
    manager: auto

- name: Reject incompatible or unpinned Slurm builds
  ansible.builtin.assert:
    that:
      - "'slurm' in ansible_facts.packages"
      - ansible_facts.packages['slurm'][0].version == slurm_package_version
    fail_msg: >-
      Installed Slurm RPM version differs from slurm_package_version
      or the core slurm RPM is missing.

- name: Discover Slurm-visible compute resources before rendering configuration
  ansible.builtin.command: slurmd -C
  register: slurm_common_discovery
  changed_when: false
  when: inventory_hostname in groups['slurm_compute']

- name: Record Slurm-detected compute memory
  ansible.builtin.set_fact:
    slurm_detected_real_memory_mb: >-
      {{
        (slurm_common_discovery.stdout
        | regex_findall('RealMemory=([0-9]+)')
        | first)
        | int
      }}
  when: inventory_hostname in groups['slurm_compute']

- name: Require usable compute memory beyond the scheduler reserve
  ansible.builtin.assert:
    that:
      - slurm_detected_real_memory_mb | int > slurm_reserve_mem_mb | int
    fail_msg: "slurmd -C reported insufficient usable memory for the configured reserve."
  when: inventory_hostname in groups['slurm_compute']

- name: Ensure Slurm and MUNGE identities exist
  ansible.builtin.user:
    name: "{{ item }}"
    system: true
    create_home: false
    shell: /sbin/nologin
  loop: [munge, slurm]

- name: Create Slurm configuration directory
  ansible.builtin.file:
    path: /etc/slurm
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create protected MUNGE directory
  ansible.builtin.file:
    path: /etc/munge
    state: directory
    owner: munge
    group: munge
    mode: "0700"

- name: Check existing MUNGE key
  ansible.builtin.stat:
    path: /etc/munge/munge.key
  register: slurm_existing_munge_key

- name: Stage encoded MUNGE key with restricted permissions
  ansible.builtin.copy:
    content: "{{ slurm_munge_key_b64 }}"
    dest: /etc/munge/munge.key.b64
    owner: root
    group: root
    mode: "0400"
  register: slurm_staged_munge_key
  no_log: true

- name: Decode binary MUNGE key
  ansible.builtin.shell: |
    umask 077
    base64 --decode /etc/munge/munge.key.b64 > /etc/munge/munge.key
    chown munge:munge /etc/munge/munge.key
    chmod 0400 /etc/munge/munge.key
  when: slurm_staged_munge_key.changed or not slurm_existing_munge_key.stat.exists
  no_log: true
  notify: restart munge

- name: Template shared Slurm configuration
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../roles/slurm_common/templates/slurm.conf.j2"
    dest: /etc/slurm/slurm.conf
    owner: root
    group: root
    mode: "0644"

- name: Enable MUNGE
  ansible.builtin.systemd:
    name: munge
    enabled: true
    state: started

- name: Apply MUNGE key updates
  ansible.builtin.meta: flush_handlers

- name: Verify MUNGE locally
  ansible.builtin.shell: "munge -n | unmunge >/dev/null"
  changed_when: false

- name: Check shared research home filesystem
  ansible.builtin.command: "findmnt --target {{ slurm_home_path }} --noheadings --output FSTYPE"
  register: slurm_home_fs
  changed_when: false
  when:
    - slurm_require_shared_home | bool
    - inventory_hostname in groups['slurm_login'] or inventory_hostname in groups['slurm_compute']

- name: Require network/shared research home
  ansible.builtin.assert:
    that:
      - slurm_home_fs.stdout | trim in ['nfs', 'nfs4', 'lustre', 'beegfs', 'ceph', 'fuse.ceph']
    fail_msg: "Mount shared {{ slurm_home_path }} before starting Slurm."
  when:
    - slurm_require_shared_home | bool
    - inventory_hostname in groups['slurm_login'] or inventory_hostname in groups['slurm_compute']
