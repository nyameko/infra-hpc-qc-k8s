---
- name: Validate required local tools
  ansible.builtin.command: "{{ item }} version"
  loop:
    - "{{ cinder_csi_helm_binary }}"
  changed_when: false
  environment:
    KUBECONFIG: "{{ cinder_csi_kubeconfig }}"

- name: Verify Kubernetes API access
  ansible.builtin.command:
    cmd: >-
      {{ cinder_csi_kubectl_binary }}
      --kubeconfig {{ cinder_csi_kubeconfig | quote }}
      version --output=yaml
  changed_when: false
  environment:
    KUBECONFIG: "{{ cinder_csi_kubeconfig }}"

- name: Validate OpenStack CSI authentication variables
  ansible.builtin.assert:
    that:
      - cinder_csi_auth_url | length > 0
      - cinder_csi_project_id | length > 0
      - cinder_csi_application_credential_id | length > 0
      - cinder_csi_application_credential_secret | length > 0
      - cinder_csi_region | length > 0
      - cinder_csi_kubeconfig | length > 0
      - cinder_csi_chart_version | length > 0
    fail_msg: >-
      Required Cinder CSI variables are missing.
      Keep OpenStack credentials in private inventory variables
      or Ansible Vault; never commit them.
  no_log: true

- name: Create Cinder CSI namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ cinder_csi_kubeconfig }}"
    api_version: v1
    kind: Namespace
    name: "{{ cinder_csi_namespace }}"
    state: present

- name: Create/update Cinder CSI OpenStack credentials Secret
  kubernetes.core.k8s:
    kubeconfig: "{{ cinder_csi_kubeconfig }}"
    namespace: "{{ cinder_csi_namespace }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ cinder_csi_secret_name }}"
        labels:
          app.kubernetes.io/name: openstack-cinder-csi
          app.kubernetes.io/component: credentials
      type: Opaque
      stringData:
        "{{ cinder_csi_secret_filename }}": |-
          [Global]
          auth-url = {{ cinder_csi_auth_url }}
          application-credential-id = {{ cinder_csi_application_credential_id }}
          application-credential-secret = {{ cinder_csi_application_credential_secret }}
          region = {{ cinder_csi_region }}
          tenant-id = {{ cinder_csi_project_id }}
          auth-type = v3applicationcredential

          [BlockStorage]
          ignore-volume-az = true
  no_log: true

- name: Install/upgrade Cinder CSI
  kubernetes.core.helm:
    name: "{{ cinder_csi_release_name }}"
    chart_ref: openstack-cinder-csi
    chart_repo_url: "{{ cinder_csi_chart_repo_url }}"
    chart_version: "{{ cinder_csi_chart_version }}"
    release_namespace: "{{ cinder_csi_namespace }}"
    kubeconfig: "{{ cinder_csi_kubeconfig }}"
    create_namespace: false
    update_repo_cache: true
    wait: true
    timeout: 10m

    release_values:
      clusterID: "{{ cinder_csi_cluster_id }}"

      secret:
        enabled: true
        create: false
        name: "{{ cinder_csi_secret_name }}"
        filename: "{{ cinder_csi_secret_filename }}"

      storageClass:
        enabled: false

      csi:
        provisioner:
          topology: true

        snapshotter:
          enabled: true

      plugin:
        httpEndpoint:
          enabled: false

        controllerPlugin:
          replicas: "{{ cinder_csi_controller_replicas }}"

- name: Create Cinder CSI StorageClasses
  kubernetes.core.k8s:
    kubeconfig: "{{ cinder_csi_kubeconfig }}"
    state: present
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: "{{ item.name }}"
        annotations:
          storageclass.kubernetes.io/is-default-class: >-
            {{ item.default | ternary('true', 'false') }}
      provisioner: cinder.csi.openstack.org
      parameters: "{{ item.parameters }}"
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      volumeBindingMode: WaitForFirstConsumer
  loop:
    - name: cinder-ssd
      default: true
      parameters:
        type: SSD

    - name: cinder-hdd
      default: false
      parameters:
        type: HDD

    - name: cinder-default
      default: false
      parameters: {}
