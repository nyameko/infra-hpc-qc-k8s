---
- name: Validate required Cinder CSI variables
  ansible.builtin.assert:
    that:
      - cinder_csi_auth_url | length > 0
      - cinder_csi_project_id | length > 0
      - cinder_csi_application_credential_id | length > 0
      - cinder_csi_application_credential_secret | length > 0
      - cinder_csi_region | length > 0
      - cinder_csi_kubeconfig | length > 0
      - cinder_csi_chart_version | length > 0
      - cinder_csi_cluster_id | length > 0
      - cinder_csi_secret_name | length > 0
      - cinder_csi_secret_filename | length > 0
      - cinder_csi_release_name | length > 0
      - cinder_csi_chart_repo_url | length > 0
    fail_msg: >-
      Required Cinder CSI variables are missing. OpenStack credentials
      belong in the private inventory or Ansible Vault and must never
      be committed to Git.
  no_log: true

- name: Verify Helm is available
  ansible.builtin.command:
    cmd: "{{ cinder_csi_helm_binary }} version --short"
  changed_when: false

- name: Create Cinder CSI namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ cinder_csi_kubeconfig }}"
    api_version: v1
    kind: Namespace
    name: "{{ cinder_csi_namespace }}"
    state: present
