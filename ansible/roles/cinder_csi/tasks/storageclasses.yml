---
- name: Create Cinder CSI StorageClasses
  kubernetes.core.k8s:
    kubeconfig: "{{ cinder_csi_kubeconfig }}"
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: "{{ item.name }}"
    state: present
    definition:
      metadata:
        annotations:
          storageclass.kubernetes.io/is-default-class: >-
            {{ item.default | ternary('true', 'false') }}
      provisioner: cinder.csi.openstack.org
      parameters: "{{ item.parameters }}"
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      volumeBindingMode: WaitForFirstConsumer
  loop:
    - name: cinder-ssd
      default: true
      parameters:
        type: SSD

    - name: cinder-hdd
      default: false
      parameters:
        type: HDD

    - name: cinder-default
      default: false
      parameters: {}
