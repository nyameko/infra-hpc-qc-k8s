---
- name: Require exact Kubernetes version for deterministic bootstrap
  ansible.builtin.assert:
    that:
      - kubernetes_version | length > 0
      - kubernetes_version is match('^v?1\\.[0-9]+\\.[0-9]+$')
    fail_msg: 'Set kubernetes_version to the exact pinned v1.x.y release in the environment configuration.'

- name: Create kubeadm configuration directory
  ansible.builtin.file:
    path: /etc/kubernetes
    state: directory
    mode: '0755'

- name: Render kubeadm configuration
  ansible.builtin.template:
    src: kubeadm.yaml.j2
    dest: /etc/kubernetes/kubeadm.yaml
    mode: '0600'

- name: Initialize CP1
  ansible.builtin.command:
    cmd: kubeadm init --config /etc/kubernetes/kubeadm.yaml --upload-certs
    creates: /etc/kubernetes/admin.conf

- name: Create admin kubeconfig directory
  ansible.builtin.file:
    path: /home/ansible/.kube
    state: directory
    owner: ansible
    group: ansible
    mode: '0700'

- name: Install admin kubeconfig for Ansible user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ansible/.kube/config
    remote_src: true
    owner: ansible
    group: ansible
    mode: '0600'
