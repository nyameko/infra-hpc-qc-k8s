---
- name: Check whether Kubernetes control plane is initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_initialized

- name: Deploy kubeadm configuration
  ansible.builtin.template:
    src: kubeadm-init.yaml.j2
    dest: /etc/kubernetes/kubeadm-init.yaml
    owner: root
    group: root
    mode: "0600"
  when: not kubeadm_initialized.stat.exists

- name: Initialize Kubernetes control plane
  ansible.builtin.command:
    cmd: kubeadm init --config /etc/kubernetes/kubeadm-init.yaml --upload-certs
  when: not kubeadm_initialized.stat.exists

- name: Create kubeconfig directory
  ansible.builtin.file:
    path: "/home/{{ admin_user_name }}/.kube"
    state: directory
    owner: "{{ admin_user_name }}"
    group: "{{ admin_user_name }}"
    mode: "0700"

- name: Install administrator kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ admin_user_name }}/.kube/config"
    remote_src: true
    owner: "{{ admin_user_name }}"
    group: "{{ admin_user_name }}"
    mode: "0600"

- name: Generate worker join command
  ansible.builtin.command:
    cmd: kubeadm token create --print-join-command
  register: kubeadm_worker_join
  changed_when: false

- name: Generate control-plane certificate key
  ansible.builtin.command:
    cmd: kubeadm init phase upload-certs --upload-certs
  register: kubeadm_upload_certs
  changed_when: false

- name: Extract certificate key
  ansible.builtin.set_fact:
    kubeadm_certificate_key: "{{ kubeadm_upload_certs.stdout_lines | select('match', '^[0-9a-f]{64}$') | list | last }}"

- name: Generate Kubernetes CA discovery hash
  ansible.builtin.shell:
    cmd: >
      openssl x509 -pubkey
      -in /etc/kubernetes/pki/ca.crt
      | openssl rsa -pubin -outform der 2>/dev/null
      | openssl dgst -sha256 -hex
      | awk '{print $2}'
  register: kubeadm_ca_hash
  changed_when: false

- name: Store discovery hash
  ansible.builtin.set_fact:
    kubeadm_discovery_ca_cert_hash: "sha256:{{ kubeadm_ca_hash.stdout }}"

- name: Extract worker join command
  ansible.builtin.set_fact:
    kubeadm_worker_join_command: "{{ kubeadm_worker_join.stdout }}"

- name: Generate control-plane join command
  ansible.builtin.set_fact:
    kubeadm_control_plane_join_command: >-
      {{ kubeadm_worker_join_command }}
      --control-plane
      --certificate-key {{ kubeadm_certificate_key }}

- name: Display bootstrap information
  ansible.builtin.debug:
    msg:
      - "Worker join command: {{ kubeadm_worker_join_command }}"
      - "Control-plane join command: {{ kubeadm_control_plane_join_command }}"
