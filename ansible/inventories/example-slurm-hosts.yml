---
# Schema-only example. Keep the live host/address map in protected inventory.
all:
  children:
    slurm_controller:
      hosts:
        slurm-controller-N:
          ansible_host: "<SLURM_CONTROLLER_ADDR_N>"
    slurm_login:
      hosts:
        login-N:
          ansible_host: "<SLURM_LOGIN_ADDR_N>"
    slurm_compute:
      hosts:
        slurm-cpu-small-N:
          ansible_host: "<SLURM_CPU_SMALL_ADDR_N>"
        slurm-cpu-large-N:
          ansible_host: "<SLURM_CPU_LARGE_ADDR_N>"
    storage_nfs:
      hosts:
        storage-N:
          ansible_host: "<STORAGE_ADDR_N>"
    slurm_cluster:
      children:
        slurm_controller: {}
        slurm_login: {}
        slurm_compute: {}
    m1_hpc:
      children:
        slurm_cluster: {}
        storage_nfs: {}
    wazuh_agents:
      children:
        slurm_cluster: {}
        storage_nfs: {}
