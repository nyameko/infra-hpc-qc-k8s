---
# Example shape only. Copy this into protected inventory and supply real
# addresses there. Public Git deliberately omits the live topology.
all:
  children:
    slurm_controller:
      hosts:
        slurm-controller-01:
          ansible_host: "<SLURM_CONTROLLER_IP>"
    slurm_login:
      hosts:
        login-01:
          ansible_host: "<SLURM_LOGIN_1_IP>"
        login-N:
          ansible_host: "<SLURM_LOGIN_N_IP>"
    slurm_compute:
      hosts:
        slurm-cpu-01:
          ansible_host: "<SLURM_COMPUTE_1_IP>"
        slurm-cpu-N:
          ansible_host: "<SLURM_COMPUTE_N_IP>"
    storage_nfs:
      hosts:
        storage-01:
          ansible_host: "<STORAGE_IP>"
    slurm_cluster:
      children:
        slurm_controller: {}
        slurm_login: {}
        slurm_compute: {}
    m1_hpc:
      children:
        slurm_cluster: {}
        storage_nfs: {}
    wazuh_agents:
      children:
        slurm_cluster: {}
        storage_nfs: {}
