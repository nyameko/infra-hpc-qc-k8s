---
# Documentation-only example, not a real inventory and never applied.
# Actual Sebowa login hosts are already configured in private/hosts.yml:
#   slurm_login: login1, login2
# Keep ACE logins in their own approved inventory and playbook.
all:
  children:
    slurm_login:
      hosts:
        login1:
          ansible_host: "<APPROVED_PRIVATE_LOGIN1_ADDRESS>"
          ansible_user: "<AUTHORIZED_HOST_ADMIN>"
        login2:
          ansible_host: "<APPROVED_PRIVATE_LOGIN2_ADDRESS>"
          ansible_user: "<AUTHORIZED_HOST_ADMIN>"
