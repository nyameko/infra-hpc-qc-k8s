---
- name: Configure Sebowa infrastructure fabric edge
  hosts: sebowa-edge
  become: true
  roles:
    - common
    - ssh
    - node_exporter
    - wg_fabric

- name: Configure ACE infrastructure fabric edge
  hosts: ace-edge-01
  become: true
  roles:
    - common
    - ssh
    - node_exporter
    - wg_fabric
    - wazuh_agent

- name: Configure ACE A100 inference host
  hosts: gpu_inference
  become: true
  roles:
    - common
    - ssh
    - node_exporter
    - wazuh_agent
    - nvidia_gpu_host
    - dcgm_exporter
    - vllm_server
