---
- name: Configure site-to-site infrastructure WireGuard edges
  hosts: fabric_edges
  become: true
  roles:
    - common
    - ssh
    - node_exporter
    - wazuh_agent
    - wg_fabric

- name: Configure ACE A100 inference host
  hosts: gpu_inference
  become: true
  roles:
    - common
    - ssh
    - node_exporter
    - wazuh_agent
    - nvidia_gpu_host
    - dcgm_exporter
    - vllm_server
