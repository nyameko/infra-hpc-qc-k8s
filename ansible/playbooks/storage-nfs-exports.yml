---
- name: Update research-storage NFS exports without touching filesystems
  hosts: storage_nfs
  become: true
  gather_facts: false
  vars_files:
    - ../group_vars/storage_cluster.yml
  pre_tasks:
    - name: Require private export CIDR list for Kubernetes access
      ansible.builtin.assert:
        that:
          - storage_nfs_export_cidrs is defined
          - storage_nfs_export_cidrs | length >= 2
        fail_msg: >-
          Supply storage_nfs_export_cidrs from protected inventory/private vars.
          Include the existing management client network and the Kubernetes
          worker network. Do not commit those environment values here.

  tasks:
    - name: Render research-storage NFS exports
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/storage_nfs/templates/quantum-platform.exports.j2"
        dest: /etc/exports.d/quantum-platform.exports
        owner: root
        group: root
        mode: "0644"

    - name: Ensure NFS server is running
      ansible.builtin.systemd:
        name: nfs-server
        enabled: true
        state: started

    - name: Reload NFS exports
      ansible.builtin.command:
        cmd: exportfs -ra
      changed_when: true

    - name: Show effective NFS exports
      ansible.builtin.command:
        cmd: exportfs -v
      register: storage_exports
      changed_when: false

    - name: Report effective NFS exports
      ansible.builtin.debug:
        var: storage_exports.stdout_lines
