---
# Explicitly run against an operator-provided private inventory; this host
# group already exists on Sebowa (login1/login2). Use --limit for narrower scope.
# No SSH, PAM, account login shell, Slurm, WireGuard, service or model changes.
- name: Install lightweight per-user terminal controls on explicitly selected hosts
  hosts: slurm_login
  become: true
  gather_facts: true
  roles:
    - research_terminal_clients
