---
# Run after CP1 is healthy. The join commands exist only in Ansible memory.
- name: Generate short-lived worker join command on CP1
  hosts: control_plane[0]
  become: true
  tasks:
    - name: Create worker join command
      ansible.builtin.command: kubeadm token create --ttl 30m --print-join-command
      register: worker_join
      changed_when: false
      no_log: true

    - name: Generate control-plane certificate key
      ansible.builtin.shell: |
        set -o pipefail
        kubeadm init phase upload-certs --upload-certs | tail -n 1
      args:
        executable: /bin/bash
      register: certificate_key
      changed_when: false
      no_log: true

    - name: Build control-plane join command
      ansible.builtin.set_fact:
        cp_join_command: "{{ worker_join.stdout }} --control-plane --certificate-key {{ certificate_key.stdout | trim }}"
      no_log: true

    - name: Share join material with later tasks
      ansible.builtin.set_fact:
        join_material:
          worker: "{{ worker_join.stdout }}"
          control_plane: "{{ cp_join_command }}"
      no_log: true

- name: Join remaining control planes
  hosts: control_plane[1:]
  become: true
  vars:
    kube_control_plane_join_command: "{{ hostvars[groups['control_plane'][0]].join_material.control_plane }}"
  roles:
    - kube_join_control_plane

- name: Join worker nodes
  hosts: workers
  become: true
  vars:
    kube_join_command: "{{ hostvars[groups['control_plane'][0]].join_material.worker }}"
  roles:
    - kube_worker
