---
storage_nfs_host: storage-N
storage_nfs_address: "<STORAGE_ADDR>"
storage_nfs_export_cidrs:
  - "<MGMT_CIDR>"
  - "<K8S_CIDR>"
storage_nfs_devices:
  home: "<HOME_DEVICE_BY_ID>"
  datasets: "<DATASETS_DEVICE_BY_ID>"
  staging: "<STAGING_DEVICE_BY_ID>"
storage_nfs_filesystems:
  - {key: home, device: "{{ storage_nfs_devices.home }}", label: QUANTUM_HOME, server_mount: /srv/home, client_mount: /home/research, mount_opts: defaults,noatime,uquota}
  - {key: datasets, device: "{{ storage_nfs_devices.datasets }}", label: QUANTUM_DATASETS, server_mount: /srv/datasets, client_mount: /datasets, mount_opts: defaults,noatime,prjquota}
  - {key: staging, device: "{{ storage_nfs_devices.staging }}", label: QUANTUM_STAGING, server_mount: /srv/staging, client_mount: /staging, mount_opts: defaults,noatime,uquota,prjquota}
storage_home_default_soft_gib: 20
storage_home_default_hard_gib: 25
storage_staging_default_soft_gib: 100
storage_staging_default_hard_gib: 125
storage_staging_retention_days: 14
storage_quota_users: []
storage_programmes: []
storage_nfs_export_options: rw,sync,root_squash,no_subtree_check,sec=sys
storage_client_mount_options: rw,hard,_netdev,nfsvers=4.2,timeo=600,retrans=2
