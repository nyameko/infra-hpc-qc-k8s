---
jupyterhub_gateway_user: jupyterhub-gateway
jupyterhub_gateway_group: jupyterhub-gateway
jupyterhub_allowed_group: jupyterhub-users
jupyterhub_gateway_public_key: ""

# Shared HPC user-environment foundation.
hpc_user_environment_epel_package: epel-release
hpc_user_environment_packages:
  - Lmod
  - apptainer
hpc_container_cache_dir: /var/cache/quantum-platform/containers

# M2 smoke image. Production offerings will be immutable digest-derived images.
jupyterhub_smoke_image_source: docker://ghcr.io/nyameko/infra-hpc-qc-k8s-jupyter-singleuser:dev
jupyterhub_smoke_image_path: "{{ hpc_container_cache_dir }}/jupyter-singleuser-m2.sif"
jupyterhub_smoke_image_stage: true

# Disposable M2-only identity. Real identities arrive from Quantum Platform in M3.
jupyterhub_smoke_user_enabled: false
jupyterhub_smoke_user: jhub-smoke
jupyterhub_smoke_uid: 20999
jupyterhub_smoke_gid: 20999
jupyterhub_smoke_slurm_account: jupyterhub-smoke


# M3c deterministic CPU execution runner. Override the tag with an immutable
# sha-<commit> reference in protected/private vars for production.
quantum_workflows_cpu_image_source: docker://ghcr.io/nyameko/quantum-workflows-qiskit-cpu:dev
quantum_workflows_cpu_image_path: "{{ hpc_container_cache_dir }}/quantum-workflows-qiskit-cpu.sif"
quantum_workflows_cpu_image_stage: true

# Bootstrap accounting account for platform-mediated runs. Programme-specific
# Slurm accounts/allocations replace this coarse association later in M3.
jupyterhub_execution_slurm_account: quantum-platform
